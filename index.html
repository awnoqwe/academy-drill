const dayKey = (t=Date.now()) => new Date(flDayStart(t)).toLocaleDateString('sv-SE');
function markDay(){ if(!S.me) return false; const d=dayKey(), arr=Array.isArray(S.me.cards._days)?S.me.cards._days:[]; if(arr[arr.length-1]===d) return false; S.me.cards._days=[...arr,d].slice(-190); return true; }
function streakDays(st=S.me){ const set=new Set(Array.isArray(st?.cards?._days)?st.cards._days:[]); let n=0, t=Date.now(); if(!set.has(dayKey(t))) t-=DAY; while(set.has(dayKey(t))){ n++; t-=DAY; } return n; }
const recordBeforeDay = record;
record = function(out){ markDay(); recordBeforeDay(out); };
const flAnswerBeforeDay = flAnswer;
flAnswer = function(r){ flAnswerBeforeDay(r); if(markDay()) persist(); };

function vToday(){
  const st=S.me, mine=gradeCards(st.grade), q=st.queue.filter(id=>mine.some(c=>c.id===id)).length;
  const flOk = FC.status==='ready' && FC.owner===st.id, fl = flOk ? flCounts() : null, fln = fl ? fl.nw+fl.lrn+fl.rev : 0;
  const hwOk = HW.status==='ready' && HW.owner===st.id, hws = hwOk ? HW.list.filter(h=>!h.done_at).sort((a,b)=>a.due.localeCompare(b.due)) : [];
  const loading = (FC.status==='loading'||FC.status==='idle'||FC.owner!==st.id) || (HW.status==='loading'||HW.status==='idle'||HW.owner!==st.id);
  const tasks=[];
  hws.slice(0,3).forEach(h=>tasks.push({kick:'숙제 · '+hwWhen(h.due), late:hwDday(h.due)<0, title:h.title, sub:h.memo,
    btns:`${h.link?`<button class="btn sm" data-hwgo="${esc(h.id)}">바로 하기</button>`:''}<button class="btn sm alt" data-hwdone="${esc(h.id)}" data-v="1">다 했어요</button>`}));
  if(fln) tasks.push({kick:'카드', title:`오늘 카드 ${fln}장`, sub:`새 카드 ${fl.nw} · 배우는 중 ${fl.lrn} · 복습 ${fl.rev}`, btns:'<button class="btn sm" data-fstudy="all">카드 공부</button>'});
  if(q) tasks.push({kick:'드릴', title:`막힌 문제 ${q}개 다시 풀기`, sub:'지난 세트에서 막힌 문제부터 나와요.', btns:'<button class="btn sm" data-act="retry">다시 풀기</button>'});
  const deck=[hws.length&&`숙제 ${hws.length}개`, fln&&`카드 ${fln}장`, q&&`재출제 ${q}문제`].filter(Boolean);
  const today=new Date(new Date().toDateString()).getTime();
  const exam=scheduleVisible().filter(e=>e.type==='exam').map(e=>({e,d:Math.round((Date.parse(e.date+'T00:00:00')-today)/DAY)})).filter(x=>x.d>=0&&x.d<=30).sort((a,b)=>a.d-b.d)[0];
  const unread=scheduleUnread().slice().sort((a,b)=>b.created-a.created), streak=streakDays();
  const seen=mine.filter(c=>st.cards[c.id]?.seen).length;
  return `<section class="lead">
    <span class="label">${todayStr()}</span>
    <h2 class="lead-head">${tasks.length?`오늘 할 일 ${tasks.length}가지`:loading?'오늘 할 일을 모으는 중…':'오늘 할 일을 다 했어요'}</h2>
    <p class="lead-deck">${deck.length?deck.join(' · '):tasks.length||loading?'':`지금까지 ${seen}/${mine.length}문제를 풀어 봤어요. 새 단원에 도전해 볼까요?`}</p>
    ${streak?`<p class="streak"><b>${streak}일</b> 연속으로 공부하고 있어요${streak>=3?' · 오늘도 이어 가요':''}</p>`:''}
  </section>
  ${tasks.length?`<div class="today-list">${tasks.map(t=>`<article class="today-item">
    <span class="today-kick ${t.late?'late':''}">${esc(t.kick)}</span>
    <h3>${esc(t.title)}</h3>${t.sub?`<p>${esc(t.sub)}</p>`:''}
    <div class="schedule-btns">${t.btns}</div></article>`).join('')}</div>`:loading?'':`<button class="btn alt" data-tab="kor">드릴 한 세트 풀기</button>`}
  ${exam?`<button class="today-exam" data-news-go="schedule"><span class="dd">${exam.d?'D-'+exam.d:'D-day'}</span><span><small>다가오는 시험</small><b>${esc(exam.e.title)}</b><em>${esc(exam.e.date)}</em></span></button>`:''}
  ${unread.length?`<section class="today-news"><div class="ask-meta"><span class="label">새 소식 ${unread.length}개</span><button class="linkbtn" data-news-go="notice">모두 보기</button></div>
    ${unread.slice(0,2).map(e=>`<button class="today-newsrow" data-news-go="notice"><span>${e.type==='exam'?'시험':'학원'}</span><b>${esc(e.title)}</b><em>${esc(e.date)}</em></button>`).join('')}</section>`:''}`;
}

  q('[data-age]').forEach(b=>b.onclick=()=>{ (S.cf||(S.cf={})).u14 = b.dataset.age==='1'; S.err=''; render(); });
  act('privacy', ()=>{ S.privacyBack=S.screen; go('privacy'); });
  act('privacyBack', ()=>go(S.privacyBack||'entry'));

Object.assign(API, {

function kidStats(k){
  const ymd=t=>new Date(t).toLocaleDateString('sv-SE'), act=(k.cards._act&&typeof k.cards._act==='object'&&!Array.isArray(k.cards._act))?k.cards._act:{};
  const fl=Object.fromEntries((k.flash_days||[]).map(x=>[x.day,+x.n]));
  const days=new Set([...(Array.isArray(k.cards._days)?k.cards._days:[]), ...Object.keys(act).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)), ...Object.keys(fl)]);
  const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate()), mon=new Date(today); mon.setDate(today.getDate()-((today.getDay()+6)%7));
  const week=off=>Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i+off*7); const key=ymd(d); return {key, label:'월화수목금토일'[i], on:days.has(key), future:d>today, today:+d===+today, drill:+act[key]||0, flash:fl[key]||0}; });
  const tw=week(0), lw=week(-1), sum=(w,f)=>w.reduce((a,x)=>a+x[f],0);
  const by={}; (k.units||[]).forEach(u=>{ const r=k.cards[u.id]; if(!r||typeof r!=='object') return; const b=(by[u.unit] ||= {seen:0,blocked:0}); b.seen+=r.seen||0; b.blocked+=r.blocked||0; });
  const weak=Object.entries(by).filter(([,v])=>v.seen>=3&&v.blocked/v.seen>=0.3).sort((a,b)=>b[1].blocked/b[1].seen-a[1].blocked/a[1].seen).map(([u])=>unitName(u));
  return {tw, lw, days:tw.filter(x=>x.on).length, lastDays:lw.filter(x=>x.on).length, drill:sum(tw,'drill'), flash:sum(tw,'flash'), weak};
}

function parentSection(s){

  const byId=Object.fromEntries(S.admin.students.map(x=>[x.id,x])), mine=A.links.filter(l=>l.student_id===s.id).map(l=>l.code);
  const others=A.codes.filter(c=>!mine.includes(c.code));

      <span class="schedule-btns">${ks.length>1?`<button class="linkbtn" data-punlink="${code}">이 학생만 연결 해제</button>`:''}${S.pdel===code?`<button class="linkbtn danger" data-pdelgo="${code}">코드 지우기</button><button class="linkbtn" data-act="pdelNo">취소</button>`:`<button class="linkbtn danger" data-pdel="${code}">코드 지우기</button>`}</span></div>`; }).join('')||'<p class="note">아직 연결된 학부모 코드가 없어요.</p>'}

      <select id="plinkSel"><option value="">가족 코드 고르기</option>${others.map(c=>`<option value="${c.code}">${pcShow(c.code)} · ${esc(c.label)} (${kidsOf(c.code).map(x=>esc(x.nick)).join(', ')})</option>`).join('')}</select></label>
      <div class="schedule-btns"><button class="btn sm alt" data-act="plink">이 코드에 추가</button></div>`:''}
    <form id="pcomment" class="schedule-form" data-sid="${esc(s.id)}"><label>학부모에게 보이는 선생님 한마디<textarea id="pcBody" rows="3" maxlength="1000" placeholder="예: 요즘 비문학 속도가 많이 좋아졌어요.">${esc(A.comments[s.id]||'')}</textarea></label>

  act('plink', ()=>{ const v=document.getElementById('plinkSel')?.value; if(!v) return; done(()=>API.parentLink(v, sid, true), '형제·자매 코드에 추가했어요. 학부모님은 같은 코드로 두 자녀를 모두 봐요.'); });
  q('[data-punlink]').forEach(b=>b.onclick=()=>done(()=>API.parentLink(b.dataset.punlink, sid, false), '이 학생을 코드에서 뺐어요.'));
  q('[data-pdel]').forEach(b=>b.onclick=()=>{ S.pdel=b.dataset.pdel; render(); });
  act('pdelNo', ()=>{ S.pdel=null; render(); });
  q('[data-pdelgo]').forEach(b=>b.onclick=()=>done(()=>API.parentDelete(b.dataset.pdelgo), '코드를 지웠어요. 그 코드로는 더 이상 볼 수 없어요.'));
  const cf=document.getElementById('pcomment'); if(cf) cf.onsubmit=e=>{ e.preventDefault(); const body=document.getElementById('pcBody').value.trim(); done(()=>API.parentComment(cf.dataset.sid, body), '한마디를 저장했어요. 학부모 화면에 보여요.'); };
}

Object.assign(API, {

const ymdOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).toLocaleDateString('sv-SE');
const WEEK = ['월','화','수','목','금','토','일'];
const DEMO_SLOTS = [['16:40','17:30'],['17:40','18:20'],['18:25','19:05'],['19:10','19:50'],['19:55','20:35'],['20:40','21:20'],['21:25','22:00']].map(([start,end])=>({start,end}));

/* --- 시간표 해석: 칸의 줄마다 '남중-영어오', '고1수학박', '국어김' --- */
function ttParse(line){
  const t=String(line||'').trim(); if(!t) return null;
  let m=t.match(/^([^\s\-–:]{1,10})\s*[-–:]\s*(.+)$/); if(m) return {pre:m[1], body:m[2].trim()};
  m=t.match(/^((?:중|고)[1-3])\s*(.+)$/); if(m) return {pre:m[1], body:m[2].trim()};
  return {pre:'', body:t};
}
const ttForStudent = (p, who) => !p.pre || p.pre==='전체' || p.pre===who.grade || (who.school && (who.school===p.pre || who.school.startsWith(p.pre) || p.pre.startsWith(who.school)));
const aliasList = a => String(a||'').split(/[,\s]+/).map(x=>x.trim()).filter(Boolean);
function ttPick(list, date){ // 그날 쓰는 시간표: 날짜 시간표가 고정 시간표를 덮어쓴다
  const ymd=ymdOf(date), wd=(date.getDay()+6)%7;
  const dated=list.filter(t=>t.kind==='dated'&&t.date_from<=ymd&&ymd<=t.date_to).sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)))[0];
  return dated || list.find(t=>t.kind==='weekly'&&t.weekday===wd) || null;
}
// 학생·학부모: 반 칸 하나만 받은 시간표 목록 → 그날 내 수업
function myLessons(list, date, who){
  const t=ttPick(list, date); if(!t) return {t:null, lessons:[]};
  const cell=Array.isArray(t.cell)?t.cell:[];
  const lessons=(t.slots||[]).flatMap((s,i)=>String(cell[i]||'').split('\n').map(ttParse).filter(p=>p&&ttForStudent(p,who)).map(p=>({start:s.start,end:s.end,text:p.body,pre:p.pre})));
  return {t, lessons};
}
// 선생님: 전체 시간표에서 내 이름(시간표 이름)이 끝에 붙은 수업만
function teacherLessons(list, date, aliases, classes){
  const t=ttPick(list, date); if(!t||!aliases.length) return {t, lessons:[]};
  const name=id=>(classes.find(c=>c.id===id)||{}).name||'반';
  const out=[];
  Object.entries(t.cells||{}).forEach(([cid,arr])=>(t.slots||[]).forEach((s,i)=>String((arr||[])[i]||'').split('\n').map(ttParse).filter(Boolean).forEach(p=>{
    if(aliases.some(a=>p.body.endsWith(a))) out.push({start:s.start,end:s.end,text:p.body,cls:name(cid),pre:p.pre});
  })));
  out.sort((a,b)=>a.start.localeCompare(b.start)||a.cls.localeCompare(b.cls));
  return {t, lessons:out};
}
const ttWhen = t => t.kind==='weekly' ? `${WEEK[t.weekday]}요일 고정` : (t.date_from===t.date_to ? `${t.date_from.slice(5).replace('-','/')} (${WEEK[(new Date(t.date_from+'T00:00:00').getDay()+6)%7]})` : `${t.date_from.slice(5).replace('-','/')}~${t.date_to.slice(5).replace('-','/')}`);
function lessonsHtml(res, empty, withCls){
  if(!res.t) return `<p class="note" style="padding:6px 0">${empty}</p>`;
  return `${res.t.kind==='dated'?`<p class="tt-flag">${esc(res.t.title||'변동 시간표')} · ${ttWhen(res.t)}</p>`:''}
    ${res.lessons.length?`<div class="rows tt-rows">${res.lessons.map(l=>`<div class="row"><span class="mark mono">${esc(l.start)}</span><span class="rq">${withCls?`<b>${esc(l.cls)}</b> `:''}${esc(l.text)}${l.pre?` <small class="dim">${esc(l.pre)}</small>`:''}</span><span class="s">~${esc(l.end)}</span></div>`).join('')}</div>`:`<p class="note" style="padding:6px 0">수업이 없어요.</p>`}`;
}

  const cf=document.getElementById('classForm'); if(cf) cf.onsubmit=e=>{ e.preventDefault(); const n=document.getElementById('className').value.trim(); if(!n) return; done(()=>API.classSave({name:n}),`'${n}' 반을 만들었어요.`); };

async function parentPushToggle(){
  const L=loc(), codes=parentCodes();

  S.ppBusy=true; render();
  try{

      const sub=await reg.pushManager.getSubscription();

      for(const c of codes){ const r=await sb.rpc('parent_push_subscribe',{p_code:c, p_subscription:sub.toJSON()}); if(r.error) throw r.error; }
      await swPost(reg,{type:'PARENT_CODES', codes}); L.parentPush=true; saveLoc(); S.ppMsg='알림을 켰어요. 알림장과 시간표 소식을 배너로 알려 드려요.';
    }

}

/* ===== 선생님: 드릴 문제 관리 =====
   드릴 문제(cards 표)를 단원별로 보고 지우고, 메모장 파일로 한꺼번에 넣는다.
   파일 양식: 문제마다 '단원:·학년:·태그:·문제:·지문:(또는 시:)·선택지:·해설:' 칸을 쓰고, 문제 사이는 '---' 한 줄로 나눈다.
   선택지는 한 줄에 하나, 정답 앞에 '*'. 파일 맨 위 '#단원:', '#학년:', '#태그:'는 그 파일 모든 문제의 기본값. */
const DRILL_UNIT = {'문법':'gram','문학':'lit','독해':'read','비문학':'read','비문학독해':'read','독서':'read','gram':'gram','lit':'lit','read':'read'};
const DRILL_LABEL = /^(과목|단원|학년|태그|유형|문제|발문|지문|시|선택지|정답|해설)\s*[:：]\s?(.*)$/;
function drillGrades(v){
  v=String(v||'').replace(/\s/g,''); if(!v) return [];
  if(/^(전체|공통|모두|전학년)$/.test(v)) return [...GRADES];
  const out=new Set();
  v.split(/[,，、/]/).filter(Boolean).forEach(t=>{
    const m=t.match(/^(중|고)?([1-3])(?:학년)?[~∼\-–](중|고)?([1-3])(?:학년)?$/);
    if(m){ const a=GRADES.indexOf((m[1]||m[3]||'')+m[2]), b=GRADES.indexOf((m[3]||m[1]||'')+m[4]); if(a>=0&&b>=a) GRADES.slice(a,b+1).forEach(g=>out.add(g)); else out.add('?'+t); return; }
    const g=t.replace(/학년$/,''); GRADES.includes(g)?out.add(g):(g==='중학교'||g==='중등')?GRADES.slice(0,3).forEach(x=>out.add(x)):(g==='고등학교'||g==='고등')?GRADES.slice(3).forEach(x=>out.add(x)):out.add('?'+t);
  });
  return [...out];
}
function drillParse(text){

    if(/^#/.test(l)) return;

    const why=[], subjTxt=trim(f['과목']||def['과목']), unitRaw=trim(f['단원']||def['단원']), unitKey=unitRaw.replace(/\s/g,'');

      else if(DRILL_UNIT[unitKey]) unit=DRILL_UNIT[unitKey]; else why.push(`'${unitRaw}'는 새 단원이에요. 어느 과목인지 '과목:'도 써 주세요`); }
    const gs=drillGrades(trim(f['학년']||def['학년'])), badG=gs.filter(g=>g.startsWith('?'));
    if(!gs.length) why.push('학년이 없어요'); else if(badG.length) why.push(`학년 '${badG.map(x=>x.slice(1)).join(', ')}' → 중1~고3으로 써 주세요`);
    const stem=trim(f['문제']); if(!stem) why.push('문제(발문)가 없어요');

function bindDrill(){

    q('[data-drf-grade]').forEach(b=>b.onclick=()=>{ const g=b.dataset.drfGrade; F.grades=F.grades.includes(g)?F.grades.filter(x=>x!==g):[...F.grades,g].sort((x,y)=>GRADES.indexOf(x)-GRADES.indexOf(y)); if(D.ferr) delete D.ferr.grades; render(); });

/* ===== 공부 시간 · 카드 빠르게 넘김 =====
   학생 기록(students.cards)에 날짜별로 쌓는다(35일치). 서버 설정 없이 학생·선생님·학부모 화면이 모두 읽는다.

   빠르게 넘김: '알맞음·쉬움'을 눌렀는데 앞면을 1.2초도 안 보고 정답을 열었거나, 정답을 열고 0.7초 안에 누른 경우 */
const studyMap=(cards,key)=>{ const m=cards&&cards[key]; return m&&typeof m==='object'&&!Array.isArray(m)?m:{}; };
function studyAdd(key, upd){ if(!S.me) return; const m=studyMap(S.me.cards,key), d=dayKey(); m[d]=upd(m[d]); Object.keys(m).sort().slice(0,-35).forEach(k=>delete m[k]); S.me.cards[key]=m; }
function studyDay(cards, d){ const sec=+studyMap(cards,'_sec')[d]||0, f=studyMap(cards,'_fl')[d]; const a=Array.isArray(f)?f:[0,0,0]; return {drill:sec, flash:+a[2]||0, n:+a[0]||0, fast:+a[1]||0}; }
const studyDays=n=>Array.from({length:n},(_,i)=>dayKey(Date.now()-i*DAY));
function studySum(cards, days){ return days.reduce((a,d)=>{ const x=studyDay(cards,d); a.drill+=x.drill; a.flash+=x.flash; a.n+=x.n; a.fast+=x.fast; return a; },{drill:0,flash:0,n:0,fast:0}); }
const fmtDur=sec=>{ const m=Math.round(sec/60); return sec<=0?'0분':m<1?'1분 미만':m<60?`${m}분`:`${Math.floor(m/60)}시간${m%60?` ${m%60}분`:''}`; };
function flTrack(f, rating){
  const now=Date.now(), el=Math.min(120000, now-(f.t0||now)), front=f.tShow?f.tShow-f.t0:el, back=f.tShow?now-f.tShow:0;
  const fast = rating>=3 && (front<1200 || back<700);
  studyAdd('_fl', v=>{ const a=Array.isArray(v)?v:[0,0,0]; return [(+a[0]||0)+1, (+a[1]||0)+(fast?1:0), Math.round(((+a[2]||0)+el/1000)*10)/10]; });
  f.uns=(f.uns||0)+1; if(f.uns>=5){ f.uns=0; persist(); }
}
const recordBeforeTime = record;
record = function(out){ if(S.me&&S.qT0){ const sec=Math.min(180,(Date.now()-S.qT0)/1000); studyAdd('_sec', v=>Math.round(((+v||0)+sec)*10)/10); } S.qT0=null; recordBeforeTime(out); };
// 학생 홈: 오늘·최근 7일 공부 시간
function studyLine(){ if(!S.me) return ''; const t=studySum(S.me.cards,[dayKey()]), w=studySum(S.me.cards,studyDays(7)), tt=t.drill+t.flash, wt=w.drill+w.flash;
  return wt?`<p class="study-line">오늘 <b>${fmtDur(tt)}</b> 공부 · 최근 7일 ${fmtDur(wt)}</p>`:''; }

// 선생님 학생 상세: 공부 시간 · 카드 넘김 · 쪽지 시험
function studySection(s){
  const c=s.cards||{}, d7=studyDays(7), t=studySum(c,[dayKey()]), w=studySum(c,d7), m=studySum(c,studyDays(30));
  const per=d7.slice().reverse().map(d=>({d, x:studyDay(c,d)})), max=Math.max(60,...per.map(p=>p.x.drill+p.x.flash));
  const pct=w.n?Math.round(w.fast/w.n*100):0, warn=w.n>=20&&pct>=30;
  return `<section class="study-sec"><span class="label">공부 시간</span>
    <section class="stats"><div class="stat"><b>${fmtDur(t.drill+t.flash)}</b><small>오늘</small></div><div class="stat"><b>${fmtDur(w.drill+w.flash)}</b><small>최근 7일</small></div><div class="stat"><b>${fmtDur(m.drill+m.flash)}</b><small>30일</small></div></section>
    <div class="weekbars" role="img" aria-label="최근 7일 공부 시간">${per.map(p=>{ const a=p.x.drill, b=p.x.flash; return `<span title="${p.d} · 드릴 ${fmtDur(a)} · 카드 ${fmtDur(b)}"><i><em style="height:${(a/max*100).toFixed(1)}%"></em><em class="fl" style="height:${(b/max*100).toFixed(1)}%"></em></i>${'일월화수목금토'[new Date(p.d+'T12:00').getDay()]}</span>`; }).join('')}</div>
    <p class="note"><i class="lg"></i>드릴 ${fmtDur(w.drill)} · <i class="lg fl"></i>카드 ${fmtDur(w.flash)} (최근 7일) · 문제가 나온 때부터 답할 때까지만 재요(한 번에 최대 2~3분)</p>
    <span class="label">카드 빠르게 넘김 · 최근 7일</span>
    <p class="${warn?'fast-warn':'note'}">${w.n?`답한 ${w.n}번 중 <b>${w.fast}번(${pct}%)</b>은 앞면을 거의 안 보고 정답을 열었거나, 정답을 보자마자 '알맞음·쉬움'을 눌렀어요.${warn?' 떠올리지 않고 넘기고 있을 수 있어요. 쪽지 시험으로 확인해 보세요.':''}`:'최근 7일 카드 기록이 없어요.'}</p>
    <button class="btn alt" data-qz="start">쪽지 시험 · '익혔다'고 한 카드에서 10문제</button>
  </section>`;
}
/* ===== 쪽지 시험 =====
   학생이 '알맞음·쉬움'으로 넘겨 복습 단계에 올라간 카드(=익혔다고 한 카드)에서 무작위로 10장을 골라 4지선다로 낸다.

    const {data}=await sb.from('drill_student_notes').select('body').eq('student_id',sid).maybeSingle();

async function qzStart(s){
  S.qz={sid:s.id, busy:true}; render();
  try{
    if(!S.fa||S.fa.status!=='ready') await flAdminLoad();
    const cards=S.fa?.cards||[], byId=new Map(cards.map(c=>[c.id,c]));
    const known=(await API.flashStatesOf(s.id)).filter(x=>x.queue==='review'&&byId.has(x.card_id)).map(x=>byId.get(x.card_id));
    const pick=flShuffle(known.slice()).slice(0,10);
    const items=pick.map(c=>{ const same=cards.filter(x=>x.deck_id===c.deck_id&&x.id!==c.id&&x.back.trim()!==c.back.trim()), other=cards.filter(x=>x.deck_id!==c.deck_id&&x.back.trim()!==c.back.trim());
      const wrong=[...new Set(flShuffle(same.slice()).concat(flShuffle(other.slice())).map(x=>x.back))].slice(0,3);
      const opts=flShuffle([c.back, ...wrong]); return {card:c, opts, ans:opts.indexOf(c.back), pick:null}; }).filter(x=>x.opts.length>=2);
    S.qz={sid:s.id, nick:s.nick, items, i:0, known:known.length, mode:'menu'};
  }catch(e){ S.qz={sid:s.id, err:'카드 기록을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'}; }
  render();
}

  // 결과

    <div class="dr-save">${Q.noted?`<p class="schedule-success">상담 노트에 남겼어요.</p>`:`<button class="btn alt" data-qz="note">상담 노트에 결과 남기기</button>`}<button class="linkbtn" data-qz="again">새 쪽지 시험</button></div>`;
}

  if(t.dataset.tgtab!==undefined){ const g=t.dataset.tgtab; S.tgtab=g;
    box.querySelectorAll('[data-tgtab]').forEach(x=>x.setAttribute('aria-pressed', String(x===t)));
    box.querySelectorAll('.tgt-studs .tgt-cell').forEach(x=>{ x.hidden = g!=='전체' && x.dataset.tgg!==g; const sm=x.querySelector(':scope>small'); if(sm) sm.hidden=g!=='전체'; });
  } else { const vis=[...box.querySelectorAll('.tgt-studs .tgt-cell:not([hidden]) input')], on=!vis.every(x=>x.checked);
    vis.forEach(x=>{ if(x.checked!==on){ x.checked=on; x.dispatchEvent(new Event('change',{bubbles:true})); } }); }
  tgtSync(box);
});
document.addEventListener('change', e=>{ const box=e.target.closest?.('.tgt'); if(box) tgtSync(box); });
// 화면을 그린 뒤 전체 선택 칸 글자를 맞춘다
new MutationObserver(()=>document.querySelectorAll('.tgt').forEach(b=>{ if(!b.dataset.synced){ b.dataset.synced='1'; tgtSync(b); } })).observe(document.documentElement,{childList:true,subtree:true});
document.addEventListener('click', e=>{ const b=e.target.closest?.('[data-fdg]'); if(!b) return; S.fdg=b.dataset.fdg; render(); });
document.addEventListener('click', e=>{ const b=e.target.closest?.('[data-drg]'); if(!b) return; S.drg=b.dataset.drg; render(); });
</script>
