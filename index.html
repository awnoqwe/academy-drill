<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아페라">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<script>/* 홈 화면 아이콘을 테마·강조색에 맞춘다: icons/<light|dark>-<강조색>/ 묶음(아이콘 3장 + manifest). 홈 화면에 추가하는 순간의 테마를 따른다. */
function iconSet(){try{var d=document.documentElement,t=d.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),a=d.getAttribute('data-accent')||'red',p='icons/'+t+'-'+a+'/';
document.querySelector('link[rel=manifest]').href=p+'manifest.webmanifest';document.querySelector('link[rel=apple-touch-icon]').href=p+'apple-touch-icon.png'}catch(e){}}iconSet();</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<title>아페라</title>
<script>try{var L=JSON.parse(localStorage.getItem('academy-drill-v3'))||{},t={paper:'light',ink:'dark'}[L.theme]||L.theme;if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);if(L.accent)document.documentElement.setAttribute('data-accent',L.accent);if(L.fs==='l'||L.fs==='xl')document.documentElement.setAttribute('data-fs',L.fs)}catch(e){}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="fonts/pretendard/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Serif+KR:wght@500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}

/* 아페라: 신문 1면. 굵은 세리프 제호(The Times), 시세 알약(Bloomberg), 굵은 명조 헤드라인. 640px 한 칼럼.
   모드는 라이트·다크(data-theme), 강조색은 학생이 고른다(data-accent). 강조색 하나가 버튼·꼭지·배지·제호의 점에 같이 쓰인다. */
:root{
  --paper:#ffffff; --sheet:#f5f5f3; --ink:#121212; --muted:#545452; --faint:#8b8b88; --rule:#dedede; --rule-strong:#121212;
  --good:#147a3d; --good-soft:#e7f4ec; --bad:#b42318; --bad-soft:#fdecec; --track:#ececea; --mid:#9a5b00; --hover:#f4f4f2; --pill:#121212; --pill-ink:#ffffff; color-scheme:light;
  --cta:#c4161c; --cta-ink:#ffffff; --omr:#c4161c; --new:#c4161c; --omr-soft:#fdecec; --anki-new:#1d6fd6; --anki-lrn:#c4161c; --anki-rev:#147a3d;
  /* 글꼴: 화면 전체는 Pretendard(OFL), 국어 지문만 명조(Noto Serif KR, OFL). --f-serif·--f-mast는 예전 이름을 그대로 두고 Pretendard를 가리킨다. */
  --f-mast:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-serif:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-text:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121212; --sheet:#1c1c1c; --ink:#f1f1ee; --muted:#b0b0ab; --faint:#80807b; --rule:#303030; --rule-strong:#f1f1ee;
  --good:#5fd08b; --good-soft:#16301f; --bad:#ff8a80; --bad-soft:#3a1d1b; --track:#2a2a2a; --mid:#e0a64a; --hover:#1f1f1f; --pill:#f1f1ee; --pill-ink:#121212; color-scheme:dark;
  --cta:#d62828; --cta-ink:#ffffff; --omr:#ff6b5e; --new:#ff6b5e; --omr-soft:#3a1d1b; --anki-new:#6aa8ff; --anki-lrn:#ff7b6e; --anki-rev:#5fd08b}}
:root[data-theme="dark"]{
  --paper:#121212; --sheet:#1c1c1c; --ink:#f1f1ee; --muted:#b0b0ab; --faint:#80807b; --rule:#303030; --rule-strong:#f1f1ee;
  --good:#5fd08b; --good-soft:#16301f; --bad:#ff8a80; --bad-soft:#3a1d1b; --track:#2a2a2a; --mid:#e0a64a; --hover:#1f1f1f; --pill:#f1f1ee; --pill-ink:#121212; color-scheme:dark;
  --cta:#d62828; --cta-ink:#ffffff; --omr:#ff6b5e; --new:#ff6b5e; --omr-soft:#3a1d1b; --anki-new:#6aa8ff; --anki-lrn:#ff7b6e; --anki-rev:#5fd08b}
:root[data-accent="black"]{--cta:#121212; --cta-ink:#ffffff; --omr:#121212; --new:#121212; --omr-soft:#ececea}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-accent="black"]{--cta:#f1f1ee; --cta-ink:#121212; --omr:#f1f1ee; --new:#f1f1ee; --omr-soft:#2a2a2a}}
:root[data-theme="dark"][data-accent="black"]{--cta:#f1f1ee; --cta-ink:#121212; --omr:#f1f1ee; --new:#f1f1ee; --omr-soft:#2a2a2a}
:root[data-accent="navy"]{--cta:#1b3a6b; --cta-ink:#ffffff; --omr:#1b3a6b; --new:#1b3a6b; --omr-soft:#e3ebf7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-accent="navy"]{--cta:#3d6db3; --cta-ink:#ffffff; --omr:#8fb4ec; --new:#8fb4ec; --omr-soft:#1c2a40}}
:root[data-theme="dark"][data-accent="navy"]{--cta:#3d6db3; --cta-ink:#ffffff; --omr:#8fb4ec; --new:#8fb4ec; --omr-soft:#1c2a40}
:root[data-accent="magenta"]{--cta:#d70e93; --cta-ink:#ffffff; --omr:#d70e93; --new:#d70e93; --omr-soft:#fbdff0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-accent="magenta"]{--cta:#dd2d9e; --cta-ink:#ffffff; --omr:#f680cb; --new:#f680cb; --omr-soft:#461638}}
:root[data-theme="dark"][data-accent="magenta"]{--cta:#dd2d9e; --cta-ink:#ffffff; --omr:#f680cb; --new:#f680cb; --omr-soft:#461638}
:root[data-accent="coral"]{--cta:#c4442c; --cta-ink:#ffffff; --omr:#c4442c; --new:#c4442c; --omr-soft:#fde9e4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-accent="coral"]{--cta:#ff7a5c; --cta-ink:#121212; --omr:#ff8f73; --new:#ff8f73; --omr-soft:#3a2019}}
:root[data-theme="dark"][data-accent="coral"]{--cta:#ff7a5c; --cta-ink:#121212; --omr:#ff8f73; --new:#ff8f73; --omr-soft:#3a2019}
:root[data-accent="khaki"]{--cta:#6e6534; --cta-ink:#ffffff; --omr:#6e6534; --new:#6e6534; --omr-soft:#f1eedf}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-accent="khaki"]{--cta:#c9bb7a; --cta-ink:#121212; --omr:#d6c98b; --new:#d6c98b; --omr-soft:#2e2b1c}}
:root[data-theme="dark"][data-accent="khaki"]{--cta:#c9bb7a; --cta-ink:#121212; --omr:#d6c98b; --new:#d6c98b; --omr-soft:#2e2b1c}
:root[data-accent="brown"]{--cta:#7a4a2a; --cta-ink:#ffffff; --omr:#7a4a2a; --new:#7a4a2a; --omr-soft:#f3e8df}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-accent="brown"]{--cta:#c08a5f; --cta-ink:#121212; --omr:#d8a47c; --new:#d8a47c; --omr-soft:#2f2219}}
:root[data-theme="dark"][data-accent="brown"]{--cta:#c08a5f; --cta-ink:#121212; --omr:#d8a47c; --new:#d8a47c; --omr-soft:#2f2219}
:root[data-accent="teal"]{--cta:#0b6f6a; --cta-ink:#ffffff; --omr:#0b6f6a; --new:#0b6f6a; --omr-soft:#def2f0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-accent="teal"]{--cta:#2bb3a8; --cta-ink:#121212; --omr:#5fd3c8; --new:#5fd3c8; --omr-soft:#16302e}}
:root[data-theme="dark"][data-accent="teal"]{--cta:#2bb3a8; --cta-ink:#121212; --omr:#5fd3c8; --new:#5fd3c8; --omr-soft:#16302e}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px 28px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
p{margin:0}
.label{font-size:11.5px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* 마스트헤드 */
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.brand .dateline{width:100%;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.brand h1{margin:0;font-family:var(--f-serif);font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.15;text-align:center}
.brand .rule2{width:100%;border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);height:4px;margin-top:10px}
.lede{margin:0;color:var(--muted);font-size:14.5px;font-family:var(--f-serif)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule)}
.stat{padding:4px 4px 14px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
.stat+.stat{border-left:1px solid var(--rule)}
.stat b{font-family:var(--f-serif);font-size:28px;font-weight:700;line-height:1.15}
.stat b small{font-size:14px}
.stat>small{font-size:12px;color:var(--muted)}
.stat.alert b{color:var(--omr)}

/* 입장 양식 */
.form{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule-strong)}
.field{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:12px;border-bottom:1px solid var(--rule);padding:6px 0}
.field span{font-size:13px;color:var(--muted);font-weight:600}
.field input{border:0;background:transparent;padding:10px 0;font:inherit;font-size:16px;color:var(--ink);min-width:0;width:100%}
.field input::placeholder{color:var(--faint);font-size:14.5px}
.field input:focus{outline:none}
.field:focus-within{border-bottom-color:var(--ink)}
.grades{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.grades button{border:0;background:none;padding:8px 0;font-size:14px;cursor:pointer}
.grades button+button{border-left:1px solid var(--ink)}
.grades button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* 로그인 화면(학생·학부모·선생님·원장): 흑백 카드 한 장. 빨강은 제호의 점에만 */
.login{width:100%;max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-top:12px;--cta:#c4161c}
.login .brand{padding:18px 0 14px}
.login .brand h1{font-size:58px}
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--sheet);border:1px solid var(--rule)}
.roles button{border:0;background:none;min-height:44px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;color:var(--muted)}
.roles button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.login .form{border-top:0;gap:10px}
.login .field{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:10px 14px 8px;border:1px solid var(--rule);border-radius:14px;background:var(--sheet)}
.login .field span{font-size:12.5px}
.login .field input{padding:4px 0 2px;font-size:16px}
.login .field:focus-within{border-color:var(--ink)}
.login .help{margin:-4px 4px 0;font-size:12.5px;color:var(--faint);line-height:1.5}
.gradebox{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--rule);border-radius:14px;background:var(--sheet)}
.gradebox .gl{font-size:12.5px;color:var(--muted);font-weight:600;padding:0 4px}
.gradebox .lv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:3px;border-radius:11px;background:var(--paper)}
.gradebox .yr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gradebox button{border:0;background:none;min-height:44px;border-radius:9px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer}
.gradebox .lv button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.gradebox .yr button{background:var(--paper)}
.gradebox .yr button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.login .actions{margin-top:6px;padding-top:0}
.login .btn{border-radius:14px;min-height:54px;background:var(--ink);border-color:var(--ink);color:var(--paper)}
.login .err{padding:0 4px}
.err{color:var(--bad);font-size:13.5px;margin:0}
.hint{font-size:12.5px;color:var(--faint);text-align:center}
.hint b{font-family:var(--f-mono);color:var(--muted)}

/* 홈 */
.seg{display:flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden;width:max-content;max-width:100%;overflow-x:auto;background:transparent}
.seg button{border:0;background:none;padding:6px 13px;cursor:pointer;font-size:14px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border-bottom:1px solid var(--rule)}
.tabs button{border:0;background:none;padding:8px 2px 10px;font-family:var(--f-serif);font-size:17px;font-weight:600;color:var(--faint);cursor:pointer;
  text-align:center;line-height:1.3;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:disabled{cursor:default}
.tabs button small{font-family:var(--f-body);font-size:11px;font-weight:500}
.quick{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;margin-top:-6px}
.q{flex:none;border:0;background:none;padding:2px 0;font-size:13.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--rule)}
.q i{width:7px;height:7px;border-radius:50%}
.tiles{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:transparent;border-radius:0;padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;min-height:104px;min-width:0}
.tile:hover{background:var(--hover)}
.tile[aria-pressed="true"]{background:var(--sheet);box-shadow:inset 0 0 0 2px var(--ink)}
.tile .tn{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;letter-spacing:.04em}
.tile b{font-family:var(--f-serif);font-size:15px;font-weight:600;line-height:1.35;flex:1}
.tile .tc{font-size:11.5px;color:var(--faint);display:flex;justify-content:space-between;gap:6px}
.tile .tc em{font-style:normal;color:var(--muted);white-space:nowrap}
.mbar{display:flex;height:3px;background:var(--track);overflow:hidden}
.mbar>span{display:block;height:100%;background:var(--omr)}
.mbar>.l2{opacity:.35}
.selnote{margin:0;font-size:13px;color:var(--muted)}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:10px}
.btn{border:1px solid var(--ink);border-radius:4px;padding:15px;font-size:16px;font-weight:600;letter-spacing:.01em;cursor:pointer;background:var(--ink);color:var(--paper);width:100%}
.btn.alt{background:transparent;color:var(--ink)}
.btn.alt b{color:var(--omr);font-family:var(--f-mono);font-weight:600}
.btn:disabled{opacity:.35;cursor:default}
.linkrow{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:12px}
.linkrow button{background:none;border:0;color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule);padding:2px}

/* 드릴 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:10px}
.quit{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 0}
.combo{font-family:var(--f-mono);font-size:13.5px;color:var(--muted)}
.combo b{color:var(--omr);font-size:15px}
.track{height:2px;background:var(--track);overflow:hidden}
.fill{height:100%;background:var(--ink)}
.sheet{display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.meta .unit{color:var(--omr);font-weight:600}
.trigger{font-family:var(--f-serif);font-size:20px;font-weight:500;line-height:1.7;margin:0;letter-spacing:-.005em}
.passage{font-family:var(--f-text);font-size:16px;line-height:1.95;white-space:pre-line;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 2px}
.passage.poem{padding-left:22px;border-left:1px solid var(--rule);border-top:0;border-bottom:0;padding-block:4px}
.ask{font-size:14px;color:var(--muted);text-align:center;font-family:var(--f-serif)}
.opts{display:flex;flex-direction:column;margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.opt{width:100%;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:14px 4px;cursor:pointer;font-size:15.5px;line-height:1.6}
.opt:hover:not(:disabled){background:var(--hover)}
.opt:disabled{cursor:default}
.bub{width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;margin-top:2px}
.opt.right{background:var(--good-soft)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--paper)}
.opt.wrong{background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt.dim{opacity:.6}
.opt.sel{background:var(--hover)}
.opt.sel .bub{background:var(--ink);color:var(--paper)}
.opt.none{grid-template-columns:1fr;color:var(--muted);font-size:14px;font-style:italic;text-align:center}
.multi-note{margin:0;padding:6px 0 8px;font-size:13.5px;color:var(--muted)}
.multi-note b{color:var(--ink)}
.verdict{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--good);padding:2px 0 2px 14px}
.verdict.bad{border-color:var(--bad)}
.verdict.mid{border-color:var(--mid)}
.verdict h3{margin:0;font-family:var(--f-serif);font-size:18px;font-weight:700}
.verdict p{font-size:15px;font-family:var(--f-serif)}
.verdict .algo{font-size:12px;color:var(--muted);letter-spacing:.02em}
.drill-actions{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 75%,transparent)}
.drill-actions .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 결과 · 목록 */
.score{display:flex;align-items:baseline;gap:10px;padding-top:6px;font-family:var(--f-serif)}
.score b{font-size:64px;font-weight:700;line-height:1}
.score span{color:var(--muted);font-size:18px}

.pq{margin:0;border-left:3px solid var(--cta);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.pq p{font:16px/1.8 var(--f-serif);margin:0;white-space:pre-line}
.pnote{display:flex;flex-direction:column;gap:6px}
.pnote p{font:15px/1.7 var(--f-serif);margin:0;color:var(--muted)}
.pcode{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--rule)}
.pcode b{font-size:20px;letter-spacing:.06em}
.pcode>span:nth-child(2){font-size:13px;color:var(--muted)}

/* 원장 업무 · 시간표 · 학원비 */
.mode-seg{margin-top:-4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);padding:4px 4px 4px 10px;font-size:14px;background:var(--sheet)}
.chip small{color:var(--muted);font-size:12px}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>label{min-width:0}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.tt-wrap{overflow-x:auto;border:1px solid var(--rule);-webkit-overflow-scrolling:touch}
.tt-grid{border-collapse:collapse;min-width:100%;font-size:13px}
.tt-grid th,.tt-grid td{border:1px solid var(--rule);padding:4px;vertical-align:top}
.tt-grid thead th{background:var(--sheet);font-weight:700;white-space:nowrap;padding:8px 6px}
.tt-grid tbody th{background:var(--sheet);min-width:80px;width:80px;font-weight:400}
.tt-grid .tt-time{width:100%;box-sizing:border-box;font:12.5px var(--f-mono);border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:3px 4px;display:block;margin-bottom:3px}
.tt-grid textarea{width:112px;min-height:46px;font:13px/1.45 var(--f-body);border:0;background:transparent;color:var(--ink);resize:vertical;padding:2px}
.tt-grid textarea:focus{outline:2px solid var(--cta);outline-offset:-2px}
.tt-grid .linkbtn{font-size:11.5px}
.tt-flag{font-size:12.5px;font-weight:700;color:var(--omr);margin:0}
.tt-rows .row{grid-template-columns:52px minmax(0,1fr) auto}
.tt-rows .mark{font-size:13px;color:var(--ink)}
.tt-rows .rq{white-space:normal}
.tt-me{display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--rule-strong);padding-top:10px}
.tt-me details summary{cursor:pointer;font-size:13px;color:var(--muted);padding:8px 0}
.fee-row{grid-template-columns:22px minmax(0,1fr) auto}
.fee-row .rq{white-space:normal}
.fee-acts .btn{padding:7px 12px}
.fee-note{border:2px solid var(--cta);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fee-note p{margin:0;font:16px var(--f-serif)}
.fee-note.late{border-color:var(--bad)}
.fee-note.late .label,.fee-note.late p{color:var(--bad)}
.notice summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:14.5px;list-style:none}
.notice summary b{font-family:var(--f-serif)}
.notice summary span{font-size:12px;white-space:nowrap}

.brand.nokick{padding-bottom:22px}
/* 오프닝 · 불러오는 중 */
#splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--paper);transition:opacity .4s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .logo,.loading-logo .logo{width:min(60vw,280px);height:auto;color:var(--ink);animation:splash-in .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes splash-in{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes splash-pulse{0%,100%{opacity:1}50%{opacity:.55}}
#splash.wait .logo,.loading-logo .logo{animation:splash-in .7s cubic-bezier(.2,.7,.2,1) both,splash-pulse 1.6s ease-in-out .9s infinite}
.loading-logo{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.loading-logo small{font-size:13px;color:var(--faint);letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){#splash .logo,.loading-logo .logo{animation:none}}
</style>

/* 수식: 카드·드릴 글에서 $...$(줄 안)와 $$...$$(따로 한 줄)를 KaTeX로 그린다. Q&A에는 쓰지 않는다.
   '$5와 $10'처럼 달러 기호가 띄어쓰기에 붙어 있으면 수식으로 보지 않고, \$는 달러 기호 그대로 둔다.
   KaTeX가 아직 안 받아졌거나 수식 문법이 틀리면 원래 글자를 그대로 보여 준다. */
const MATH_RE=/\\\$|\$\$([\s\S]+?)\$\$|\$(?=[^\s$])((?:\\.|[^$\\\n])*?[^\s\\$])\$/g, mathCache=new Map();
function mtx(s){
  s=String(s??''); if(!s.includes('$')) return esc(s);
  const K=window.katex; let out='', last=0;
  for(const m of s.matchAll(MATH_RE)){
    out+=esc(s.slice(last,m.index)); last=m.index+m[0].length;
    if(m[0]==='\\$'){ out+='$'; continue; }
    const tex=m[1]??m[2], disp=m[1]!=null, key=(disp?'D':'I')+tex;
    if(!K){ out+=esc(m[0]); continue; }
    let h=mathCache.get(key);
    if(h==null){ try{ h=K.renderToString(tex,{displayMode:disp, throwOnError:true, strict:'ignore', output:'html', trust:false}); }catch(e){ h=esc(m[0]); } if(mathCache.size>3000) mathCache.clear(); mathCache.set(key,h); }
    out+=h;
  }
  return out+esc(s.slice(last));
}

async function shrinkImg(img, max, q, limit){
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height, k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w0*k)); c.height = Math.max(1, Math.round(h0*k));

// 데모: 학생 기록 옮기기(into가 없으면 삭제)
function demoMerge(from, into){
  const db=demoDB(), a=db.students[from], b=into?db.students[into]:null; if(!a) return;
  if(b){
    Object.entries(a.cards||{}).forEach(([k,v])=>{ const w=b.cards[k]; if(!w) b.cards[k]=v; else if(typeof v==='object'&&!Array.isArray(v)&&typeof w==='object'&&!Array.isArray(w)){ w.seen=(w.seen||0)+(v.seen||0); w.ok=(w.ok||0)+(v.ok||0); w.blocked=(w.blocked||0)+(v.blocked||0); } });
    b.queue=[...new Set([...(b.queue||[]),...(a.queue||[])])]; b.lastSeen=Math.max(a.lastSeen||0,b.lastSeen||0); b.approved=true;
    (db.qna||[]).forEach(q=>{ if(q.sid===from) q.sid=into; });
    if(db.flash){ const fs=db.flash.states[from]||{}, ts=(db.flash.states[into] ||= {}); Object.entries(fs).forEach(([k,v])=>{ if(!ts[k]) ts[k]=v; }); db.flash.logs.forEach(l=>{ if(l.student_id===from) l.student_id=into; }); }
    (db.hw||[]).forEach(h=>{ if(from in h.rec){ if(!(into in h.rec)||!h.rec[into]) h.rec[into]=h.rec[into]||h.rec[from]; delete h.rec[from]; } });
    if(db.notes?.[from]){ db.notes[into]=[db.notes[into],db.notes[from]].filter(Boolean).join('\n\n'); }
    sched.groups.forEach(g=>{ if(g.members.includes(from)){ g.members=g.members.filter(x=>x!==from); if(!g.members.includes(into)) g.members.push(into); } });
  }
  if(db.flash){ delete db.flash.states[from]; db.flash.logs=db.flash.logs.filter(l=>l.student_id!==from); }
  (db.hw||[]).forEach(h=>{ delete h.rec[from]; }); if(db.notes) delete db.notes[from];
  db.qna=(db.qna||[]).filter(q=>q.sid!==from); sched.groups.forEach(g=>{ g.members=g.members.filter(x=>x!==from); });
  delete db.students[from]; saveLoc(); try{ schedSave(); }catch(e){}
}

/* --- 드릴 --- */
function vDrill(){
  const c = CARDS.find(x=>x.id===S.set[S.idx]);
  const n = S.set.length, retry = S.retryIds.has(c.id);
  const done = S.phase==='feedback';
  const r = S.results[S.results.length-1];
  let opts = '', acts = '', fb = '';
  if(S.phase!=='think'){
    opts = `${done?'':'<p class="note">아닌 것 같은 선지는 ⚐ 제외로 표시해요. 다시 누르면 복원돼요.</p>'}<ol class="opts">${c.opts.map((o,i)=>{
      let cls = S.sel.has(i)?'sel':'';
      if(done){ cls = c.ans.includes(i)?'right':(S.sel.has(i)?'wrong':'dim'); }
      return `<li class="option-row ${!done&&S.excluded.has(i)?'excluded':''}"><button class="opt ${cls}" data-opt="${i}" ${done||S.excluded.has(i)?'disabled':''}><span class="bub">${i+1}</span><span>${mtx(o)}</span></button>${done?'':`<button class="exclude-btn" data-exclude="${i}" aria-pressed="${S.excluded.has(i)}" aria-label="${i+1}번 선지 ${S.excluded.has(i)?'제외 해제':'제외'}">${S.excluded.has(i)?'⚑ 복원':'⚐ 제외'}</button>`}</li>`;}).join('')}
      ${done?'':`<li><button class="opt none" data-act="missing">떠올린 게 선지에 없어요</button></li>`}</ol>`;
  }
  if(S.phase==='think') acts = `<div class="two"><button class="btn alt" data-act="unknown">모르겠어요</button><button class="btn" data-act="open">떠올렸어요</button></div>`;
  else if(S.phase==='choose') acts = `<p class="multi-note">정답 <b>${c.ans.length}개</b> · 모두 고른 뒤 확인을 눌러 주세요</p><button class="btn" data-act="check" ${S.sel.size?'':'disabled'}>확인 · ${S.sel.size}/${c.ans.length}</button>`;
  else {
    const cls = r.out==='ok'?'':r.out==='missing'?'mid':'bad';
    fb = `<div class="verdict ${cls}"><h3>${r.out==='ok'?'정확히 떠올렸어요':r.out==='wrong'?'다르게 떠올렸어요':r.out==='unknown'?'모르겠어요':'떠올린 게 선지에 없었어요'}</h3>
      <p>${mtx(c.explain)}</p>${r.out!=='ok'?'<span class="algo">다음 세트에 다시 나와요.</span>':''}
      <button class="linkbtn" style="align-self:flex-start" data-act="askThis">이 문제 질문하기</button>${flLinkBtn(c)}</div>`;
    acts = `<button class="btn" data-act="next">${S.idx+1<n?'다음 문제':'결과 보기'}</button>`;
  }
  return `<div class="top"><button class="quit" data-act="quit">← 그만하기</button>
    <span class="combo mono">${S.idx+1} / ${n}${S.combo>=2?` · 콤보 <b>${S.combo}</b>`:''}</span></div>
  <div class="track" aria-hidden="true"><div class="fill" style="width:${(S.idx+(done?1:0))/n*100}%"></div></div>
  <article class="sheet">
    <div class="meta"><span class="unit">${unitName(c.unit)}${retry?' · 다시':''}</span><span>${esc(c.tag)}</span></div>
    <p class="trigger">${mtx(c.stem)}</p>
    ${c.passage?`<div class="passage ${c.poem?'poem':''}">${mtx(c.passage)}</div>`:''}
    ${S.phase==='think'?'<p class="ask">이 문제를 보면 무엇부터 떠올려야 할까요? 머릿속으로 정한 다음 눌러요.</p>':''}
    ${opts}${fb}
  </article>
  <div class="drill-actions">${acts}</div>`;
}

/* 드릴(문제) 현황: 숫자 · 드릴 잔디 · 단원별 진도 · 막힌 문제. 학생 상세에서 숙제 바로 위에 놓는다. */
function drillStudentSection(s){
  const m = studentSummary(s), mine = gradeCards(s.grade);
  const seen = mine.filter(c=>s.cards[c.id]?.seen).length;
  const mature = UNITS.reduce((a,u)=>a+unitStats(s,u.id).mature,0);
  const blocked = CARDS.map(c=>({c,r:s.cards[c.id]})).filter(x=>x.r&&x.r.blocked).sort((a,b)=>b.r.blocked-a.r.blocked);
  return `<section style="display:flex;flex-direction:column;gap:10px"><span class="label">드릴</span>
  <section class="stats">
    <div class="stat"><b>${seen}<small>/${mine.length}</small></b><small>풀어 본 문제</small></div>
    <div class="stat"><b>${mature}</b><small>익힘</small></div>
    <div class="stat ${m.blockedPct>=30?'alert':''}"><b>${m.blockedPct}<small>%</small></b><small>막힘</small></div>
  </section></section>
  ${drillGrass(s)}
  <section><span class="label">단원별 진도</span>
    ${gradeUnits(s.grade).map(u=>{const t=unitStats(s,u.id),pc=x=>(x/t.total*100).toFixed(2)+'%';return `<div class="unitrow">
      <div class="h"><b>${esc(u.subj)} · ${esc(u.name)}</b><span>진도 ${t.seenPct}% · 익힘 ${t.maturePct}%</span></div>
      <div class="mbar"><span style="width:${pc(t.mature)}"></span><span class="l2" style="width:${pc(t.seen-t.mature)}"></span></div></div>`;}).join('')}</section>
  <section style="display:flex;flex-direction:column;gap:8px"><span class="label">막힌 문제</span>
    <div class="rows">${blocked.map(x=>{const mk=MARK[x.r.last]||MARK.wrong;return `<div class="row"><span class="mark ${mk[1]}">${mk[0]}</span><span class="rq">${esc(x.c.tag)} · ${unitName(x.c.unit)}</span><span class="s">${x.r.blocked}회 · 최근 ${mk[2]}</span></div>`;}).join('')||'<p class="lede" style="padding:12px 0">막힌 문제가 없어요.</p>'}</div></section>`;
}

async function enter(code, nick, grade, phone){
  S.busy = true; S.err=''; render();
  try{
    const r = await API.enter(code, nick, grade, phone);
    if(r.status!=='ok'){
      S.busy=false; S.join={code, nick, grade, phone, other:(r.otherGrades||[]).filter(g=>g!==grade)};
      S.join.academy = r.academy||''; S.join.under14 = r.under14;
      const keep = ['pending','consent','guardian'].includes(r.status);
      loc().session = keep ? {code, nick, grade, phone} : null; saveLoc();
      if(r.status==='new'||r.status==='consent') S.cf = {agree:false, u14: r.under14??null};
      go(keep ? r.status : 'join'); return;
    }
    const {student, cards, sessionToken} = r; S.acName = r.academy||S.acName||'';
    CARDS = cards; S.me = student; S.code = code; S.phone = phone; S.scheduleToken=sessionToken||null; scheduleOwner='';
    S.picked = new Set(gradeUnits(grade, curSubj(grade)).map(u=>u.id));
    loc().session = {code, nick, grade, phone}; saveLoc();
    S.busy = false; go('home');
  }catch(e){
    S.busy = false;
    go('entry');
    if(e.message==='bad_code'){ loc().session = null; saveLoc(); S.err='입장 코드가 맞지 않아요. 선생님께 코드를 다시 확인하세요.'; }
    else if(e.message==='bad_phone'){ loc().session = null; saveLoc(); S.err='전화번호를 정확히 써 주세요. (예: 010-1234-5678)'; }
    else if(e.message==='lib') S.err='서버 연결 프로그램을 불러오지 못했어요. 와이파이를 바꾸거나 광고 차단을 끄고 새로고침해 주세요. (코드: lib)';
    else S.err='서버에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요. (오류: '+e.message+')';
    render();
  }
}
let saving = null;
function persist(){
  const st = S.me;
  saving = API.save(st).then(()=>{ S.saveFail=false; }).catch(()=>{ S.saveFail=true; });
}
function startSet(){
  const st = S.me;
  const pool = gradeCards(st.grade).filter(c=>S.picked.has(c.unit));
  const size = S.size || pool.length;
  const set = st.queue.filter(id=>pool.some(c=>c.id===id)).slice(0,size);
  S.retryIds = new Set(set);
  st.queue = st.queue.filter(id=>!set.includes(id));
  const score = c => {const r=st.cards[c.id]; return r ? (r.last==='ok'?r.ok*2:0) + r.seen*0.1 : -1;};
  pool.filter(c=>!set.includes(c.id)).sort((a,b)=>score(a)-score(b)).forEach(c=>{ if(set.length<size) set.push(c.id); });
  S.set = set; S.idx = 0; S.phase='think'; S.sel=new Set(); S.excluded=new Set(); S.results=[]; S.combo=0; S.best=0; S.qT0=Date.now();
  persist(); go('drill');
}
function record(out){
  const st = S.me, id = S.set[S.idx];
  const r = st.cards[id] || (st.cards[id]={seen:0,ok:0,blocked:0,last:null});
  r.seen++; r.last = out;
  if(out==='ok'){ r.ok++; S.combo++; S.best=Math.max(S.best,S.combo); }
  else { r.blocked++; S.combo=0; if(!st.queue.includes(id)) st.queue.push(id); }
  st.lastSeen = Date.now();
  S.results.push({id,out}); S.phase='feedback'; persist(); render();
}
function quick(kind){
  const st = S.me, us = gradeUnits(st.grade, curSubj(st.grade));
  if(kind==='all') S.picked = new Set(us.map(u=>u.id));
  else if(kind==='none') S.picked = new Set();
  else if(kind==='new') S.picked = new Set(us.filter(u=>unitStats(st,u.id).seen===0).map(u=>u.id));
  else if(kind==='weak') S.picked = new Set(us.filter(u=>{const t=unitStats(st,u.id);return t.seen>0&&t.maturePct<50;}).map(u=>u.id));
  render();
}
async function openAdmin(){

    render();

}

    else if(a==='adminBack') go('admin');

    else if(a==='cancelRep'){ S.confirmRep=null; render(); }
    else if(a==='askThis'){ S.qnaCard = c.id; S.tab='qna'; S.toast=''; go('home'); loadQna(); }
    else if(a==='qnaDetach'){ S.qnaCard=null; render(); }
    else if(a==='qnaAll'){ S.qnaMine=false; render(); }
    else if(a==='qnaMineOnly'){ S.qnaMine=true; render(); }
    else if(a==='qnaReload') loadQna();
    else if(a==='qnaPost'){
      const body = S.form.q.trim(), ph = S.qPhotos||[];
      if(body.length<2 && !ph.length){ S.qnaErr='질문을 두 글자 이상 쓰거나 사진을 붙여 주세요.'; S.toast=''; return render(); }
      S.busy=true; S.qnaErr=''; render();
      try{ await API.qnaPost(body, S.qnaCard, ph); ph.forEach(p=>URL.revokeObjectURL(p.url)); S.qPhotos=[]; S.form.q=''; S.qnaCard=null; S.busy=false; S.toast='질문을 올렸어요.'; await loadQna(); }
      catch(e){ S.busy=false; S.qnaErr = e.message==='too_many' ? '질문은 하루에 10개까지 올릴 수 있어요.' : e.message==='photo' ? '사진을 올리지 못했어요. 잠시 뒤 다시 해 주세요.' : '질문을 올리지 못했어요. 인터넷 연결을 확인해 주세요.'; render(); }
    }
  });
}

function vGroups(){return `<h2 class="schedule-head">학생 그룹</h2><p class="lede">반·학교·학년별로 묶어 같은 일정을 한 번에 보내세요.</p>${scheduleGroupMessage?`<p class="schedule-success" role="status">${esc(scheduleGroupMessage)}</p>`:''}<form id="groupCreate" class="schedule-form"><label>새 그룹 이름<input name="groupName" required maxlength="30" placeholder="예: 새빛중 2학년"></label><button class="btn alt" type="submit">그룹 만들기</button></form><div class="schedule-grouplist">${sched.groups.map(g=>`<form data-group-form="${esc(g.id)}" class="schedule-form"><fieldset><legend>${esc(g.name)} · ${g.members.length}명</legend><div class="schedule-targets">${scheduleStudents().map(s=>`<label class="check"><input type="checkbox" name="member" value="${esc(s.id)}" ${g.members.includes(s.id)?'checked':''}>${esc(s.nick)} · ${s.grade}</label>`).join('')}</div><button class="btn sm alt" style="margin-top:12px" type="submit">구성원 저장</button></fieldset></form>`).join('')}</div><p class="note">그룹 변경은 다음 배포부터 적용됩니다. 이미 보낸 일정의 수신 학생은 유지돼요.</p>`}
function parseScheduleCSV(text){let rows=[],row=[],v='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){row.push(v);v=''}else if(c==='\n'&&!q){row.push(v.replace(/\r$/,''));rows.push(row);row=[];v=''}else v+=c}if(q)throw Error('CSV의 따옴표를 확인해주세요.');if(v||row.length){row.push(v.replace(/\r$/,''));rows.push(row)}if(rows.shift()?.join(',')!=='날짜,제목,메모')throw Error('첫 행은 날짜,제목,메모여야 해요.');rows=rows.filter(r=>r.some(x=>x.trim()));if(!rows.length||rows.length>100)throw Error('CSV에 1~100개 일정을 넣어주세요.');for(let r of rows){let d=new Date(r[0]+'T00:00:00Z');if(!/^\d{4}-\d{2}-\d{2}$/.test(r[0])||isNaN(d)||d.toISOString().slice(0,10)!==r[0]||!r[1]?.trim())throw Error('날짜(YYYY-MM-DD)와 제목을 확인해주세요.')}return rows}

 f.elements.namedItem('attachment').onchange=async()=>{uploading=true;scheduleFiles=null;scheduleCsv=[];err('');f.elements.namedItem('title').required=true;try{let file=f.elements.namedItem('attachment').files[0];if(!file){f.querySelector('#scheduleFileState').textContent='';return}if(file.size>1024*1024)throw Error('첨부는 1MB 이하로 선택해주세요.');if(file.name.toLowerCase().endsWith('.csv')){scheduleCsv=parseScheduleCSV((await file.text()).replace(/^\uFEFF/,''));f.elements.namedItem('title').required=false;f.querySelector('#scheduleFileState').textContent=scheduleCsv.length+'개 일정 불러옴 · 배포 버튼을 누르면 등록돼요.'}else{if(!['application/pdf','image/png','image/jpeg'].includes(file.type))throw Error('PDF·PNG·JPG 파일만 첨부할 수 있어요.');let data=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});scheduleFiles={name:file.name,data};f.querySelector('#scheduleFileState').textContent=file.name+' · 학생이 내려받을 수 있어요.'}}catch(e){f.elements.namedItem('attachment').value='';f.querySelector('#scheduleFileState').textContent='';err(e.message||'파일을 읽지 못했어요.')}finally{uploading=false}};
 f.onsubmit=e=>{e.preventDefault();if(uploading){err('첨부파일을 읽고 있어요. 잠시 후 배포해주세요.');return}let targets=Array.from(f.querySelectorAll('[name=target]:checked')).map(x=>x.value),recipients=scheduleRecipients(targets);if(!recipients.length){err('받을 학생이 있는 그룹이나 개인을 선택해주세요.');return}let rows=scheduleCsv.length?scheduleCsv:[[f.elements.namedItem('date').value,f.elements.namedItem('title').value.trim(),f.elements.namedItem('memo').value]],created=Date.now(),events=rows.map((r,i)=>({id:'event-'+created+'-'+i,type:f.elements.namedItem('type').value,title:r[1],date:r[0],memo:r[2]||'',targets,recipients,created,attachment:scheduleFiles}));sched.events.push(...events);if(!schedSave()){sched.events.splice(-events.length);err(scheduleMessage);return}scheduleDraft={};scheduleMessage=events.length+'개 일정을 '+recipients.length+'명에게 배포했어요. 학생 화면의 알림함에서 확인할 수 있어요.';render()};}

// 실서비스: 일정은 Supabase RPC에만 저장하며 로컬 데모로 대체하지 않는다.

async function loadSchedules(force=false,quiet=false){if(DEMO||scheduleLoading)return;const owner=scheduleCurrentOwner();if(!owner||(!force&&owner===scheduleOwner))return;scheduleOwner=owner;scheduleLoading=true;if(!quiet){scheduleStatus='loading';render()}let changed=false;try{if(owner!=='teacher'&&!S.scheduleToken){scheduleStatus='missing';return}const {data,error}=await sb.rpc(owner==='teacher'?'drill_schedule_admin':'drill_schedule_student',owner==='teacher'?{p_academy:AID()}:{p_token:S.scheduleToken});if(scheduleCurrentOwner()!==owner)return;if(error){scheduleStatus=scheduleError(error);return}const next={groups:data.groups||[],events:(data.events||[]).map(e=>({...e,created:Date.parse(e.created)})),reads:data.reads||{}};changed=JSON.stringify(next)!==JSON.stringify(sched);sched=next;scheduleStatus='ready'}catch(e){if(scheduleCurrentOwner()===owner)scheduleStatus=scheduleError(e)}finally{scheduleLoading=false;if(scheduleCurrentOwner()===owner&&(!quiet||changed)){if(quiet&&S.screen==='home'&&!['schedule','notice'].includes(S.tab)){let badge=app.querySelector('[data-tab=notice]');if(badge)badge.innerHTML='알림'+(scheduleUnread().length?'<span class="badge">'+scheduleUnread().length+'</span>':'')}else render()}}}
async function scheduleRPC(name,args){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}

let scheduleWorking=false;
const bindScheduleLocal=bindSchedule;
bindSchedule=function(){bindScheduleLocal();if(DEMO)return;let owner=scheduleCurrentOwner();if(owner&&owner!==scheduleOwner&&!scheduleLoading)queueMicrotask(()=>loadSchedules());app.querySelectorAll('[data-sreload]').forEach(b=>b.onclick=()=>loadSchedules(true));

/* ===== 플래시카드 (FSRS-6 · 버튼 3개: 다시 / 알맞음 / 쉬움) =====
   기억 모델은 FSRS-6 기본 파라미터(안정도 S·난이도 D·기억 확률 R)로, 목표 기억률 90%가 되는 날에 복습을 잡는다.
   FSRS는 공개된 알고리즘을 여기서 직접 구현했다(안키 코드는 쓰지 않음). 처음 배우는 카드는 안키처럼 1분·10분 단계를 거치고,
   복습에서 틀리면 10분 재학습 뒤 FSRS 간격으로 돌아간다. 하루는 새벽 4시에 바뀌고, 3일 이상 간격은 조금 흔든다.
   예전(SM-2) 기록은 다음 복습 때 간격·난이도(ease)로 S·D를 어림해 이어 간다.
   모든 답은 flash_logs에 번호(1·3·4)와 시각으로 남아, 나중에 학생 기록으로 파라미터를 최적화할 수 있다. */
const FL = {steps:[60,600], relearn:[600], maxIvl:36500, aheadSec:1200, rollover:4, retention:0.9};
const FSRS_W = [0.212,1.2931,2.3065,8.2956,6.4133,0.8334,3.0194,0.001,1.8722,0.1666,0.796,1.4835,0.0614,0.2629,1.6483,0.6014,1.8729,0.5425,0.0912,0.0658,0.1542];
const DAY = 864e5;
function flDayStart(t=Date.now()){const d=new Date(t);d.setHours(FL.rollover,0,0,0);if(d.getTime()>t)d.setDate(d.getDate()-1);return d.getTime();}
function flDayAt(days,now){const d=new Date(flDayStart(now));d.setDate(d.getDate()+days);return d.getTime();}
function flFuzz(ivl){if(ivl<3)return ivl;const f=ivl<7?1:ivl<30?Math.max(2,Math.round(ivl*.15)):Math.max(4,Math.round(ivl*.05));return ivl-f+Math.floor(Math.random()*(2*f+1));}
const flCap = i => Math.min(FL.maxIvl, Math.max(1, Math.round(i)));
// FSRS-6 식
const fsW = FSRS_W, fsDecay = -fsW[20], fsFactor = Math.pow(0.9, 1/fsDecay) - 1;
const fsClampD = d => Math.min(10, Math.max(1, d));
const fsClampS = v => Math.min(FL.maxIvl, Math.max(0.001, v));
const fsR = (t, st) => Math.pow(1 + fsFactor*t/st, fsDecay);                       // t일 지난 뒤 기억 확률
const fsIvl = st => flCap(st/fsFactor*(Math.pow(FL.retention, 1/fsDecay) - 1));    // 기억률이 목표까지 떨어지는 날
const fsD0raw = g => fsW[4] - Math.exp(fsW[5]*(g-1)) + 1;
const fsS0 = g => fsClampS(fsW[g-1]);
const fsNextD = (d, g) => { const dp = d + (-fsW[6]*(g-3))*(10-d)/9; return fsClampD(fsW[7]*fsD0raw(4) + (1-fsW[7])*dp); };
const fsRecallS = (st, d, r, g) => fsClampS(st*(1 + Math.exp(fsW[8])*(11-d)*Math.pow(st,-fsW[9])*(Math.exp(fsW[10]*(1-r))-1)*(g===4?fsW[16]:1)));
const fsForgetS = (st, d, r) => fsClampS(Math.min(fsW[11]*Math.pow(d,-fsW[12])*(Math.pow(st+1,fsW[13])-1)*Math.exp(fsW[14]*(1-r)), st/Math.exp(fsW[17]*fsW[18])));
const fsShortS = (st, g) => { let k = Math.exp(fsW[17]*(g-3+fsW[18]))*Math.pow(st,-fsW[19]); if(g>=3) k = Math.max(k,1); return fsClampS(st*k); };
// 예전 SM-2 상태에서 S·D 어림: 90% 목표에서 간격 ≈ S, ease 250% ≈ D 5, 130% ≈ D 10
function fsFromLegacy(s){
  if(s.stab>0 && s.diff>0) return;
  s.diff = fsClampD(5 + (2500-(s.ease||2500))/1000*4.17);
  s.stab = s.queue==='learn' ? fsS0(3) : fsClampS(Math.max(1, s.ivl||1));
  if(!s.last) s.last = s.queue==='review' ? s.due - (s.ivl||1)*DAY : s.due;
}
// 이 답 뒤의 기억 상태(S·D)
function fsMemory(s, g, now){
  if(!(s.stab>0)){ s.stab = fsS0(g); s.diff = fsClampD(fsD0raw(g)); s.last = now; return; }
  const t = Math.max(0, Math.round((flDayStart(now)-flDayStart(s.last||now))/DAY));
  const st = s.stab, d = s.diff;
  if(t===0) s.stab = fsShortS(st, g);
  else { const r = fsR(t, st); s.stab = g===1 ? fsForgetS(st, d, r) : fsRecallS(st, d, r, g); }
  s.diff = fsNextD(d, g); s.last = now;
}
// st: 지금 상태(없으면 새 카드) · rating: 1 다시, 3 알맞음, 4 쉬움 · fuzz=false는 버튼에 보여 줄 간격 계산용
function flNext(st, rating, now, fuzz=true){
  const s = st ? {...st} : {queue:'new', step:0, ivl:0, ease:2500, reps:0, lapses:0, due:now};
  const kind = s.queue;
  const before = kind==='review' ? s.ivl : kind==='new' ? 0 : -((kind==='relearn'?FL.relearn:FL.steps)[s.step]||0);
  if(kind!=='new') fsFromLegacy(s);
  // 쉬움 간격이 알맞음보다 길도록, 알맞음을 눌렀을 때의 간격을 먼저 구해 둔다
  const goodIvl = (()=>{ if(rating!==4) return 0; const t={...s}; fsMemory(t, 3, now); return fsIvl(t.stab); })();
  fsMemory(s, rating, now);
  s.reps++;
  const fz = ivl => fuzz ? flFuzz(ivl) : ivl;
  const learn = (q, steps, step) => { s.queue=q; s.step=step; s.due=now+steps[step]*1000; };
  const review = ivl => { s.queue='review'; s.step=0; s.ivl=Math.min(FL.maxIvl, Math.max(1, ivl)); s.due=flDayAt(s.ivl,now); };
  const ivlFor = () => rating===4 ? Math.max(fsIvl(s.stab), goodIvl+1) : fsIvl(s.stab);
  if(kind==='new' || kind==='learn' || kind==='relearn'){
    const steps = kind==='relearn' ? FL.relearn : FL.steps, q = kind==='relearn' ? 'relearn' : 'learn';
    if(rating===1) learn(q, steps, 0);
    else if(rating===4) review(fz(ivlFor()));
    else { const n=(kind==='new'?0:s.step)+1; n<steps.length ? learn(q, steps, n) : review(fz(ivlFor())); }
  } else {
    if(rating===1){ s.lapses++; s.ivl=fsIvl(s.stab); learn('relearn', FL.relearn, 0); }
    else review(rating===4 ? Math.max(fz(ivlFor()), goodIvl+1) : fz(ivlFor()));
  }
  return {state:s, kind, before, logIvl: s.queue==='review' ? s.ivl : -Math.round((s.due-now)/1000)};
}
function flSpan(st, rating, now){
  const s = flNext(st, rating, now, false).state;
  if(s.queue==='review'){ const d=s.ivl; return d<30 ? d+'일' : d<365 ? +(d/30).toFixed(1)+'개월' : +(d/365).toFixed(1)+'년'; }
  const sec=(s.due-now)/1000; return sec<3600 ? Math.round(sec/60)+'분' : Math.round(sec/3600)+'시간';
}
const flUuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}));

function flPending(sid=S.me?.id){ const L=loc(); L.flashPending ||= {}; return (L.flashPending[sid] ||= []); }
async function flFlush(){
  if(FC.flushing || !S.me) return; FC.flushing=true; const sid=S.me.id, q=flPending(sid); let fail='';
  try{ while(q.length && S.me?.id===sid){ try{ await API.flashReview({...q[0], sid}); } catch(e){ const k=flErr(e); if(k!=='no_card'){ fail=k; break; } } q.shift(); saveLoc(); } }
  finally{ FC.flushing=false; }
  if(FC.saveFail!==fail){ FC.saveFail=fail; if(S.screen==='home'&&S.tab==='flash') render(); }
}
function flPri(){ const L=loc(); return new Set(((L.flashPri||{})[S.me?.id])||[]); }
function flSetPri(ids){ const L=loc(); L.flashPri ||= {}; L.flashPri[S.me.id]=[...ids]; saveLoc(); }

/* --- 오늘 할 카드 --- */
function flScope(deckIds){ const ids=new Set((deckIds||FC.decks.map(d=>d.id))); return FC.cards.filter(c=>ids.has(c.deck_id)); }
function flNewCards(deckIds){
  const pri=flPri(), ds=FC.decks.filter(d=>!deckIds||deckIds.includes(d.id)), first=[], rest=[];
  ds.forEach(d=>{
    const fresh=FC.cards.filter(c=>c.deck_id===d.id&&!FC.states[c.id]);
    const left=Math.max(0, d.new_per_day - FC.cards.filter(c=>c.deck_id===d.id&&FC.newToday.has(c.id)).length);
    first.push(...fresh.filter(c=>pri.has(c.id))); rest.push(...fresh.filter(c=>!pri.has(c.id)).slice(0,left));
  });
  return [...first, ...rest];
}
function flCounts(deckIds, now=Date.now()){
  const end=flDayAt(1,now); let lrn=0, rev=0;
  flScope(deckIds).forEach(c=>{ const s=FC.states[c.id]; if(!s) return; if(s.queue==='review'){ if(s.due<=now) rev++; } else if(s.due<end) lrn++; });
  return {nw:flNewCards(deckIds).length, lrn, rev};
}
const flTodayTotal = () => { if(FC.status!=='ready'||FC.owner!==S.me?.id) return 0; const c=flCounts(); return c.nw+c.lrn+c.rev; };
function flPick(deckIds, now=Date.now()){
  const mine=flScope(deckIds), st=c=>FC.states[c.id], byDue=(a,b)=>st(a).due-st(b).due;
  const learnDue=mine.filter(c=>st(c)&&st(c).queue!=='review'&&st(c).due<=now).sort(byDue); if(learnDue[0]) return learnDue[0];
  const revDue=mine.filter(c=>st(c)&&st(c).queue==='review'&&st(c).due<=now).sort(byDue); if(revDue[0]) return revDue[0];
  const fresh=flNewCards(deckIds); if(fresh[0]) return fresh[0];
  return mine.filter(c=>st(c)&&st(c).queue!=='review'&&st(c).due<=now+FL.aheadSec*1000).sort(byDue)[0] || null;
}
function flLaterLearn(deckIds, now=Date.now()){
  const t=flScope(deckIds).map(c=>FC.states[c.id]).filter(s=>s&&s.queue!=='review'&&s.due>now&&s.due<flDayAt(1,now)).map(s=>s.due);
  return t.length ? Math.max(1, Math.round((Math.min(...t)-now)/6e4)) : 0;
}

function flAnswer(rating){
  const f=S.fl, c=FC.cards.find(x=>x.id===f.cur); if(!c||!f.shown) return;
  flTrack(f, rating);
  if(f.mode==='cram'){
    if(rating===1){ f.list.splice(Math.min(3,f.list.length),0,c.id); f.again++; } else f.done++;

  const now=Date.now(), r=flNext(FC.states[c.id], rating, now);

/* ===== 학생 상세: 접속 잔디 · 하루 카드 =====
   서버: student_days(접속한 날짜, students.last_seen 트리거) + flash_logs(복습 기록)을 student_activity RPC로 받는다.
   데모: 복습 기록 날짜 + 마지막 접속일로 어림한다. */
const dkey = t => { const d=new Date(t), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
Object.assign(API, {
  async studentActivity(id){
    if(DEMO){ const db=flDemo(), f=db.flash, st=db.students[id], flash={}, seen=new Set();
      f.logs.filter(l=>l.student_id===id).forEach(l=>{ const k=dkey(l.reviewed_at); flash[k]=(flash[k]||0)+1; seen.add(k); });
      if(st?.lastSeen) seen.add(dkey(st.lastSeen));
      // 예시 학생: 화면 확인용으로 접속일을 몇 개 더 깐다
      if(st?.example) for(let i=1;i<60;i+=1+((i*7)%4)) seen.add(dkey(Date.now()-i*DAY));
      return {seen:[...seen], flash:Object.entries(flash).map(([day,n])=>({day,n}))}; }
    const {data,error}=await sb.rpc('student_activity',{p_student:id}); if(error) throw error; return data;
  }
});
document.addEventListener('click', e=>{ const c=e.target.closest?.('.gd[data-gk]'); if(!c) return;
  const sec=c.closest('section')||document; if(c.closest('section')?.querySelector('#gPick')) S.gsel=c.dataset.gk; sec.querySelectorAll('.gd.sel').forEach(x=>x.classList.remove('sel')); c.classList.add('sel');
  const p=sec.querySelector('.gpick'); if(p) p.innerHTML=esc(c.dataset.gi)+' <span class="dim">· 칸을 누르면 그날 기록이 보여요</span>'; });
function drillGrass(s){
  const act=(s.cards?._act&&typeof s.cards._act==='object'&&!Array.isArray(s.cards._act))?s.cards._act:{}, days=new Set(Array.isArray(s.cards?._days)?s.cards._days:[]);
  Object.keys(act).forEach(k=>days.add(k));
  const W=26, now=new Date(), today=dkey(now), t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()), dow=(t0.getDay()+6)%7, start=new Date(t0.getTime()-(dow+7*(W-1))*DAY);
  const kor=k=>{ const [y,m,d]=k.split('-'); return `${+m}월 ${+d}일(${'일월화수목금토'[new Date(+y,m-1,+d).getDay()]})`; };
  const lvl=n=>n<5?1:n<15?2:3, info=k=>{ const n=act[k]||0; return `${kor(k)}${k===today?' · 오늘':''} · ${days.has(k)?(n?`문제 ${n}개`:'드릴 함'):'드릴 안 함'}`; };
  const mons=[], cells=[]; let pm=-1;
  for(let w=0;w<W;w++){ const mon=new Date(start.getTime()+w*7*DAY), m=mon.getMonth(); mons.push(m!==pm&&(w===0||mon.getDate()<=7)?`<span>${m+1}월</span>`:'<span></span>'); pm=m;
    for(let r=0;r<7;r++){ const d=new Date(start.getTime()+(w*7+r)*DAY), k=dkey(d); if(d>t0){ cells.push('<i class="gd fut"></i>'); continue; }
      const n=act[k]||0, cls=n?'f'+lvl(n):days.has(k)?'on':'';
      cells.push(`<i class="gd ${cls}${k===today?' today':''}" data-gk="${k}" data-gi="${esc(info(k))}" title="${esc(info(k))}"></i>`); } }
  const sum=n=>{ let c=0,d=0; for(let i=0;i<n;i++){ const k=dkey(t0.getTime()-i*DAY); c+=act[k]||0; if(days.has(k)) d++; } return {c,d}; };
  const w7=sum(7), w30=sum(30); let inRow=0; for(let i=days.has(today)?0:1;i<400;i++){ if(days.has(dkey(t0.getTime()-i*DAY))) inRow++; else break; }
  return `<section style="display:flex;flex-direction:column;gap:10px"><div class="ghead"><span class="label">드릴 잔디 · 문제 푼 날과 푼 문제 수 (최근 26주)</span><span class="mono">${inRow}일 연속</span></div>
    <div class="grass" style="--w:${W}"><span></span><div class="gmon">${mons.join('')}</div>
      <div class="gdays"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div><div class="gcells">${cells.join('')}</div></div>
    <p class="gpick">${esc(info(today))} <span class="dim">· 칸을 누르면 그날 기록이 보여요</span></p>
    <div class="glegend"><span><i class="gd"></i>없음</span><span><i class="gd f1"></i>1~4문제</span><span><i class="gd f2"></i>5~14문제</span><span><i class="gd f3"></i>15문제 이상</span></div>
    <div class="gsum"><span>최근 7일 <b class="${w7.d===0?'hot':''}">${w7.d}</b>일 · <b>${w7.c}</b>문제</span><span>30일 <b>${w30.d}</b>일 · <b>${w30.c}</b>문제${w30.d?` · 푼 날 하루 평균 <b>${Math.round(w30.c/w30.d)}</b>문제`:''}</span></div>
  </section>`;
}
function actLoad(id){

  API.studentActivity(id).then(d=>{ if(S.act?.id!==id) return; S.act={id, status:'ready', seen:new Set(d.seen||[]), flash:Object.fromEntries((d.flash||[]).map(x=>[x.day,+x.n]))}; render(); })
    .catch(e=>{ if(S.act?.id!==id) return; S.act={id, status:/42883|PGRST202|does not exist|42P01/.test((e?.code||'')+' '+(e?.message||''))?'missing':'error'}; render(); });
}
function actSection(s){
  const A=S.act, head='<span class="label">공부 잔디 · 접속한 날과 넘긴 카드 수 (최근 26주)</span>';

  if(A.status!=='ready') return `<section style="display:flex;flex-direction:column;gap:8px">${head}<p class="note">접속 기록을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p></section>`;
  const W=26, now=new Date(), today=dkey(now), t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const dow=(t0.getDay()+6)%7; // 월=0
  const start=new Date(t0.getTime()-(dow+7*(W-1))*DAY);
  const lvl=n=>!n?0:n<20?1:n<50?2:3, kor=k=>{ const [y,m,d]=k.split('-'); return `${+m}월 ${+d}일(${'일월화수목금토'[new Date(+y,m-1,+d).getDay()]})`; };
  const mons=[], cells=[]; let pm=-1;
  for(let w=0;w<W;w++){ const mon=new Date(start.getTime()+w*7*DAY); const m=mon.getMonth(); mons.push(m!==pm&&(w===0||mon.getDate()<=7)?`<span>${m+1}월</span>`:'<span></span>'); pm=m;
    for(let r=0;r<7;r++){ const d=new Date(start.getTime()+(w*7+r)*DAY), k=dkey(d); if(d>t0){ cells.push('<i class="gd fut"></i>'); continue; }
      const n=A.flash[k]||0, on=A.seen.has(k)||n>0, cls=n?'f'+lvl(n):on?'on':'';
      const info=`${kor(k)} · ${on?'접속':'접속 없음'}${n?` · 카드 ${n}장`:''}`;
      cells.push(`<i class="gd ${cls}${k===today?' today':''}${k===S.gsel?' sel':''}" data-gk="${k}" data-gi="${esc(info)}" title="${esc(info)}"></i>`); } }
  const days=(n,fn)=>{ let c=0; for(let i=0;i<n;i++){ const k=dkey(t0.getTime()-i*DAY); if(fn(k)) c++; } return c; };
  const sum=(n,fn)=>{ let c=0; for(let i=0;i<n;i++){ c+=fn(dkey(t0.getTime()-i*DAY)); } return c; };
  const seen7=days(7,k=>A.seen.has(k)||A.flash[k]), seen30=days(30,k=>A.seen.has(k)||A.flash[k]);
  const f7=sum(7,k=>A.flash[k]||0), f30=sum(30,k=>A.flash[k]||0), fd7=days(7,k=>A.flash[k]), fd30=days(30,k=>A.flash[k]);
  let streak=0; for(let i=A.flash[today]?0:1;;i++){ if(A.flash[dkey(t0.getTime()-i*DAY)]) streak++; else break; }
  const seenK=k=>A.seen.has(k)||A.flash[k]; let inRow=0; for(let i=seenK(today)?0:1;i<400;i++){ if(seenK(dkey(t0.getTime()-i*DAY))) inRow++; else break; }
  const last14=[...Array(14)].map((_,i)=>{ const k=dkey(t0.getTime()-(13-i)*DAY); return {k, n:A.flash[k]||0, d:new Date(t0.getTime()-(13-i)*DAY)}; }), mx=Math.max(1,...last14.map(x=>x.n));
  return `<section style="display:flex;flex-direction:column;gap:10px"><div class="ghead">${head}<span class="mono">${inRow}일 연속 접속</span></div>
    <div class="grass" style="--w:${W}"><span></span><div class="gmon">${mons.join('')}</div>
      <div class="gdays"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div><div class="gcells">${cells.join('')}</div></div>
    <p class="gpick" id="gPick" aria-live="polite">${(()=>{ const k=S.gsel&&S.gsel<=today?S.gsel:today, n=A.flash[k]||0, on=A.seen.has(k)||n>0; return `${kor(k)}${k===today?' · 오늘':''} · ${on?'접속':'접속 없음'}${n?` · 카드 ${n}장`:''}`; })()} <span class="dim">· 칸을 누르면 그날 기록이 보여요</span></p>
    <div class="glegend"><span><i class="gd"></i>없음</span><span><i class="gd on"></i>접속</span><span><i class="gd f1"></i>카드 1~19장</span><span><i class="gd f2"></i>20~49장</span><span><i class="gd f3"></i>50장 이상</span></div>
    <div class="gsum"><span>접속 최근 7일 <b class="${seen7===0?'hot':''}">${seen7}</b>일 · 30일 <b>${seen30}</b>일</span><span>카드 최근 7일 <b>${f7}</b>장${fd7?` · 복습한 날 하루 평균 <b>${Math.round(f7/fd7)}</b>장`:''}</span><span>30일 <b>${f30}</b>장${fd30?` · 하루 평균 <b>${Math.round(f30/fd30)}</b>장`:''}</span><span>연속 복습 <b class="${streak>=7?'hot':''}">${streak}</b>일</span></div>
    <span class="label">최근 14일 · 하루 카드 복습 수</span>
    <div class="gbars">${last14.map(x=>`<div title="${kor(x.k)} · ${x.n}장"><b>${x.n||''}</b><i class="${x.n?'':'z'}" style="height:${x.n?Math.max(6,Math.round(x.n/mx*44)):2}px"></i></div>`).join('')}</div>
    <div class="gbarl">${last14.map(x=>`<span>${x.d.getDate()===1||x===last14[0]?`<b>${x.d.getMonth()+1}/</b>`:''}${x.d.getDate()}<br><small>${'일월화수목금토'[x.d.getDay()]}</small></span>`).join('')}</div>
  </section>`;
}

/* ===== 카드 구성(필드) =====
   덱의 fields: [{id, n:항목 이름, s:'f'(앞)|'b'(뒤), k:'h'(크게)|'t'(보통)|'s'(작게), l:true면 항목 이름을 같이 보여 준다}].
   카드의 fields: {항목id: 글}. 예전 카드(fields 없음)는 front·back 글을 그대로 보여 준다.
   front·back 글은 항목에서 만들어 항상 같이 저장한다 — 중복 검사·자주 틀리는 카드·쪽지 시험·학부모 화면이 그대로 쓴다. */
const FL_DEFAULT_FIELDS = [{id:'front', n:'앞면', s:'f', k:'h'}, {id:'back', n:'뒷면', s:'b', k:'t'}];
const FL_PRESETS = [
  {id:'basic', name:'기본 — 앞면 / 뒷면', fields:FL_DEFAULT_FIELDS},
  {id:'vocab', name:'어휘장 — 표제어 / 한자 · 뜻풀이 · 예문 · 유의어 · 혼동어', fields:[
    {id:'word',n:'표제어',s:'f',k:'h'},{id:'hanja',n:'한자',s:'b',k:'s'},{id:'mean',n:'뜻풀이',s:'b',k:'t'},
    {id:'ex',n:'예문',s:'b',k:'s',l:true},{id:'syn',n:'유의어',s:'b',k:'s',l:true},{id:'conf',n:'혼동어',s:'b',k:'s',l:true}]},
  {id:'concept', name:'개념어 — 용어 / 정의 · 예시 · 주의', fields:[
    {id:'term',n:'용어',s:'f',k:'h'},{id:'def',n:'정의',s:'b',k:'t'},{id:'ex',n:'예시',s:'b',k:'s',l:true},{id:'warn',n:'주의',s:'b',k:'s',l:true}]},
  {id:'reverse', name:'뜻 → 단어 — 뜻풀이 / 단어 · 예문', fields:[
    {id:'mean',n:'뜻풀이',s:'f',k:'t'},{id:'word',n:'단어',s:'b',k:'h'},{id:'ex',n:'예문',s:'b',k:'s',l:true}]}
];
const FL_KIND = {h:'크게', t:'보통', s:'작게'};
const flFields = d => Array.isArray(d?.fields)&&d.fields.length ? d.fields : FL_DEFAULT_FIELDS;
const flIsDefault = fs => fs.length===2 && fs[0].id==='front' && fs[0].s==='f' && fs[1].id==='back' && fs[1].s==='b';
const flFieldsOk = fs => fs.length>=2 && fs.length<=10 && fs.every(f=>f.n.trim()) && fs.some(f=>f.s==='f') && fs.some(f=>f.s==='b');
const flCloneFields = fs => fs.map(f=>({id:f.id, n:f.n, s:f.s, k:f.k, ...(f.l?{l:true}:{})}));
// 항목 → front·back 글. 앞면은 앞 항목들을 줄바꿈으로, 뒷면은 '이름: 글'(이름 표시일 때)로 잇는다.
function flSideText(fs, vals, side){
  return fs.filter(f=>f.s===side).map(f=>{ const v=String(vals?.[f.id]??'').trim(); return v ? (f.l?`${f.n}: ${v}`:v) : ''; }).filter(Boolean).join('\n');
}
// 항목 글을 정리한다: 덱에 있는 항목만, 앞뒤 공백 없이, 빈 항목은 뺀다.
function flNormVals(fs, vals){ const o={}; fs.forEach(f=>{ const v=String(vals?.[f.id]??'').replace(/\r\n?/g,'\n').trim(); if(v) o[f.id]=v; }); return o; }
// 저장할 카드 모양: {front, back, fields}. 기본 구성(앞면/뒷면)이면 fields를 저장하지 않는다(예전 카드와 똑같은 모양).
function flMakeCard(fs, vals){
  const v=flNormVals(fs, vals), front=flSideText(fs,v,'f'), back=flSideText(fs,v,'b');
  return {front, back, fields: flIsDefault(fs) ? null : v};
}
// 예전 카드(fields 없음)를 항목 편집 칸에 올릴 때: 첫 앞 항목에 front, 첫 뒤 항목에 back
function flCardVals(fs, c){ if(c.fields&&Object.keys(c.fields).length) return c.fields; const f=fs.find(x=>x.s==='f'), b=fs.find(x=>x.s==='b'); return {[f.id]:c.front, [b.id]:c.back}; }
// 카드 한 쪽을 그린다. 항목 글이 없는 예전 카드는 글 한 덩어리로.
function flSideHtml(d, c, side){
  const fs=flFields(d), vals=c.fields;
  if(!vals||!Object.keys(vals).length) return side==='f' ? `<p class="fc-front">${mtx(c.front)}</p>` : `<p class="fc-back">${mtx(c.back)}</p>`;
  const parts=fs.filter(f=>f.s===side).map(f=>{ const v=String(vals[f.id]??'').trim(); if(!v) return '';
    return `<div class="fc-f fc-${f.k||'t'}">${f.l?`<span class="fc-lab">${esc(f.n)}</span>`:''}<span class="fc-v">${mtx(v)}</span></div>`; }).join('');
  return `<div class="${side==='f'?'fc-front':'fc-back'} fc-fields">${parts||`<span class="dim">(${side==='f'?'앞면':'뒷면'}이 비어 있어요)</span>`}</div>`;
}
// 가져온 줄(칸 배열) → 카드. map[i]는 i번째 칸이 들어갈 항목 id('' 이면 건너뜀). 항목에 못 넣고 남은 칸은 마지막 뒤 항목에 줄을 바꿔 붙인다(예전 '셋째 칸부터 뒷면' 규칙).
function flRowsToCards(fs, rows, map){
  map = map || fs.map(f=>f.id);
  const lastB=[...fs].reverse().find(f=>f.s==='b')?.id, out=[]; let skipped=0;
  rows.forEach(r=>{ const cols=r.cols||[r.front, r.back], vals={};
    cols.forEach((v,i)=>{ v=String(v||'').trim(); if(!v) return; const id=i<map.length ? map[i] : lastB; if(!id||!fs.some(f=>f.id===id)) return; vals[id]=vals[id] ? vals[id]+'\n'+v : v; });
    const c=flMakeCard(fs, vals);
    if(c.front&&c.back&&c.front.length<=2000&&c.back.length<=4000) out.push(c); else skipped++; });
  return {cards:out, skipped};
}
const flColCount = rows => Math.min(12, rows.reduce((m,r)=>Math.max(m,(r.cols||[]).length),0));
const flFieldsErr = e => /42703|column .*fields/i.test((e?.code||'')+' '+(e?.message||''));
function flFieldsHint(e){ if(flFieldsErr(e)) e.userMsg="카드 구성 기능을 쓰려면 Supabase SQL Editor에서 sql/flash_fields.sql을 한 번 실행해 주세요(기존 카드·기록은 그대로예요)."; throw e; }

/* --- 선생님: 덱·카드 관리 --- */
Object.assign(API, {
  async flashAdmin(){
    if(DEMO){ const f=flDemo().flash; return {decks:f.decks.slice().sort((a,b)=>a.sort-b.sort), cards:f.cards.slice().sort((a,b)=>a.sort-b.sort), stats:flStatsDemo()}; }
    // 카드는 1000장씩 나눠 끝까지 받는다(Supabase는 한 번에 최대 1000줄만 돌려준다)
    const allCards=async()=>{ const out=[]; for(let k=0;;k+=1000){ const r=await sb.from('flash_cards').select('*').eq('academy_id',AID()).order('sort').order('created_at').order('id').range(k,k+999); if(r.error) return r; out.push(...r.data); if(r.data.length<1000) return {data:out}; } };
    const [d,c,s] = await Promise.all([sb.from('flash_decks').select('*').eq('academy_id',AID()).order('sort').order('created_at'), allCards(), sb.rpc('flash_admin_stats',{p_academy:AID()})]);
    const e=d.error||c.error||s.error; if(e) throw e;
    return {decks:d.data, cards:c.data.map(x=>({...x,links:x.links||[]})), stats:s.data};
  },
  async flashDeckSave(v){
    if(DEMO){ const f=flDemo().flash; if(v.id){ const w={...v}; if(w.fields===undefined) delete w.fields; Object.assign(f.decks.find(d=>d.id===v.id), w); saveLoc(); return v.id; } const id='dk-'+Date.now()+'-'+Math.random().toString(36).slice(2,6); f.decks.push({...v, id, sort:v.sort||f.decks.length+1}); saveLoc(); return id; }
    // fields가 undefined면 그대로 두고, null이면 기본 구성으로 되돌린다
    const fld = v.fields===undefined ? {} : {fields: v.fields&&!flIsDefault(v.fields) ? flCloneFields(v.fields) : null};
    if(v.id){ const {error} = await sb.from('flash_decks').update({name:v.name,grades:v.grades,new_per_day:v.new_per_day,...fld}).eq('id',v.id); if(error) flFieldsHint(error); return v.id; }
    const {data, error} = await sb.from('flash_decks').insert({academy_id:AID(),name:v.name,grades:v.grades,new_per_day:v.new_per_day,sort:v.sort||(S.fa?.decks.length||0)+1,...fld}).select('id').single();
    if(error) flFieldsHint(error); return data.id;

function flStatsDemo(){
  const db=flDemo(), f=db.flash, now=Date.now(), m30=now-30*DAY, out={students:{}, cards:[]};
  Object.values(db.students).forEach(s=>{
    const decks=new Set(f.decks.filter(d=>d.grades.includes(s.grade)).map(d=>d.id)), st=f.states[s.id]||{}, logs=f.logs.filter(l=>l.student_id===s.id), l30=logs.filter(l=>l.reviewed_at>m30), rv=l30.filter(l=>l.kind==='review');
    out.students[s.id]={due:Object.entries(st).filter(([cid,x])=>x.due<=now&&decks.has(f.cards.find(c=>c.id===cid)?.deck_id)).length, started:Object.keys(st).length,
      reviews30:l30.length, review30:rv.length, kept30:rv.filter(l=>l.rating>1).length, last:logs.length?Math.max(...logs.map(l=>l.reviewed_at)):null};
    const mine=Object.entries(st).filter(([cid])=>decks.has(f.cards.find(c=>c.id===cid)?.deck_id)).map(([,v])=>v), t0=new Date(); t0.setHours(0,0,0,0);
    Object.assign(out.students[s.id], {assigned:f.cards.filter(c=>decks.has(c.deck_id)).length, seen:mine.length,
      learn:mine.filter(v=>v.queue!=='review').length, young:mine.filter(v=>v.queue==='review'&&v.ivl<21).length, mature:mine.filter(v=>v.queue==='review'&&v.ivl>=21).length,
      today:logs.filter(l=>l.reviewed_at>=t0.getTime()).length, today_new:logs.filter(l=>l.reviewed_at>=t0.getTime()&&l.kind==='new').length});
  });
  const by={}; f.logs.filter(l=>l.reviewed_at>m30).forEach(l=>{ const x=by[l.card_id] ||= {card_id:l.card_id,n:0,again:0}; x.n++; if(l.rating===1) x.again++; });
  out.cards=Object.values(by).filter(x=>x.n>=3).sort((a,b)=>b.again/b.n-a.again/a.n);
  return out;
}

/* 선생님: 학생이 오늘 앱을 열면 보는 숫자(안키 첫 화면의 새 카드·학습·만기). 학생 앱과 같은 계산 — 하루는 새벽 4시에 바뀌고, 새 카드는 덱마다 '하루 새 카드 수'에서 오늘 본 만큼 뺀다. */
Object.assign(API, {
  async studentFlashToday(id){
    const since=flDayStart();
    if(DEMO){ const f=flDemo().flash; return {states:Object.entries(f.states[id]||{}).map(([card_id,x])=>({card_id, queue:x.queue, due:x.due})),
      logs:f.logs.filter(l=>l.student_id===id&&l.reviewed_at>=since).map(l=>({card_id:l.card_id, kind:l.kind}))}; }
    const page=async q=>{ const out=[]; for(let k=0;;k+=1000){ const r=await q().range(k,k+999); if(r.error) throw r.error; out.push(...r.data); if(r.data.length<1000) return out; } };
    const [st, lg]=await Promise.all([
      page(()=>sb.from('flash_states').select('card_id,queue,due').eq('student_id',id).order('card_id')),
      page(()=>sb.from('flash_logs').select('card_id,kind').eq('student_id',id).gte('reviewed_at',new Date(since).toISOString()).order('id'))]);
    return {states:st.map(x=>({...x, due:Date.parse(x.due)})), logs:lg};
  }
});
function ftLoad(id){
  S.ft={id, status:'loading'};
  API.studentFlashToday(id).then(d=>{ if(S.ft?.id!==id) return; S.ft={id, status:'ready', ...d}; render(); })
    .catch(()=>{ if(S.ft?.id!==id) return; S.ft={id, status:'error'}; render(); });
}
function ftView(s){
  const T=S.ft, A=S.fa, head='<span class="label">오늘 카드 · 학생 앱 첫 화면과 같은 숫자</span>';
  if(!T||T.id!==s.id){ queueMicrotask(()=>ftLoad(s.id)); return `${head}<p class="note">불러오는 중…</p>`; }
  if(T.status==='loading') return `${head}<p class="note">불러오는 중…</p>`;
  if(T.status!=='ready') return `${head}<p class="note">오늘 카드를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>`;
  const now=Date.now(), end=flDayAt(1,now), st=new Map(T.states.map(x=>[x.card_id,x])), newT=new Set(T.logs.filter(l=>l.kind==='new').map(l=>l.card_id));
  const rows=A.decks.filter(d=>d.grades.includes(s.grade)).map(d=>{
    let fresh=0, lrn=0, rev=0, nd=0;
    A.cards.forEach(c=>{ if(c.deck_id!==d.id) return; const x=st.get(c.id); if(!x){ fresh++; return; } if(newT.has(c.id)) nd++;
      if(x.queue==='review'){ if(x.due<=now) rev++; } else if(x.due<end) lrn++; });
    return {d, nw:Math.min(fresh, Math.max(0, d.new_per_day-nd)), lrn, rev, nd};
  });
  if(!rows.length) return `${head}<p class="note">이 학년에 배정된 덱이 아직 없어요.</p>`;
  const tot=rows.reduce((a,r)=>({nw:a.nw+r.nw, lrn:a.lrn+r.lrn, rev:a.rev+r.rev}),{nw:0,lrn:0,rev:0});
  const doneNew=T.logs.filter(l=>l.kind==='new').length, doneAll=T.logs.length, doneCards=new Set(T.logs.map(l=>l.card_id)).size;
  const num=(n,c)=>`<td class="${n?c:'zero'}">${n}</td>`;
  return `${head}<div class="ankit-wrap"><table class="ankit"><thead><tr><th>덱</th><th>새 카드</th><th>학습</th><th>만기</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><th scope="row">${esc(r.d.name)}<small>하루 새 ${r.d.new_per_day}장${r.nd?` · 오늘 ${r.nd}장 봄`:''}</small></th>${num(r.nw,'an')}${num(r.lrn,'al')}${num(r.rev,'ar')}</tr>`).join('')}</tbody>
    ${rows.length>1?`<tfoot><tr><th scope="row">합계</th>${num(tot.nw,'an')}${num(tot.lrn,'al')}${num(tot.rev,'ar')}</tr></tfoot>`:''}</table></div>
    <p class="note">오늘 공부: 새 카드 <b>${doneNew}</b>장 · 복습·학습 <b>${doneAll-doneNew}</b>번 · 카드 ${doneCards}장을 ${doneAll}번 넘김 <span class="dim">(새벽 4시 기준)</span></p>
    <p class="note dim">새 카드는 오늘 더 볼 수 있는 새 카드, 학습은 오늘 안에 다시 나올 배우는 중 카드, 만기는 지금 복습할 때가 된 카드예요.</p>`;
}
function flStudentSection(s){
  const A=S.fa, head='<span class="label">플래시카드</span>';
  if(!A||A.status==='loading') return `<section>${head}<p class="lede" style="padding:12px 0">불러오는 중…</p></section>`;
  if(A.status!=='ready') return '';
  const x=A.stats?.students?.[s.id]||{due:0,started:0,reviews30:0,review30:0,kept30:0,last:null};
  // 배정 카드: 이 학생 학년에 배정된 덱의 카드(선생님 화면은 학원 카드를 전부 받아 둔다)
  const decks=new Set(A.decks.filter(d=>d.grades.includes(s.grade)).map(d=>d.id));
  const assigned=x.assigned ?? A.cards.filter(c=>decks.has(c.deck_id)).length;
  const full=x.mature!==undefined, seen=Math.min(assigned, full?x.seen:x.started), unseen=Math.max(0, assigned-seen);
  const last=x.last?flMs(x.last):null, keep=x.review30?Math.round(x.kept30/x.review30*100):null;
  // 하루 카드 수: 접속 잔디와 같은 기록(날짜별 복습 수)으로 최근 7일 평균을 낸다
  const act=S.act?.id===s.id&&S.act.status==='ready'?S.act:null, t0=new Date(); t0.setHours(0,0,0,0);
  const today=x.today ?? (act?act.flash[dkey(t0)]||0:null);
  let wk=null; if(act){ wk=0; for(let i=0;i<7;i++) wk+=act.flash[dkey(t0.getTime()-i*DAY)]||0; }
  const pills=`<section class="stats fl-pills">
    <div class="stat"><small>배정 카드</small><b>${assigned}<small>장</small></b></div>
    <div class="stat"><small>안 본 카드</small><b>${unseen}<small>장</small></b></div>
    <div class="stat"><small>본 카드</small><b>${seen}<small>장</small></b></div>
    <div class="stat"><small>오늘 넘긴 카드</small><b>${today===null?'–':today}${today===null?'':'<small>장</small>'}</b></div></section>`;
  const pc=n=>assigned?(n/assigned*100):0, pct=n=>assigned?Math.round(n/assigned*100)+'%':'–';
  const seg=full?[['mature','성숙 · 간격 21일 이상',x.mature],['young','어린 카드 · 21일 미만',x.young],['learn','배우는 중',x.learn],['unseen','안 본 카드',unseen]]:null;
  const mat = !assigned ? '<p class="note">이 학년에 배정된 덱이 아직 없어요.</p>'
    : full ? `<div class="flm-bar" role="img" aria-label="${seg.map(g=>g[1].split(' · ')[0]+' '+g[2]+'장').join(', ')}">${seg.map(g=>g[2]?`<span class="${g[0]}" style="width:${pc(g[2]).toFixed(2)}%"></span>`:'').join('')}</div>
      <div class="flm-list">${seg.map(g=>`<div><i class="${g[0]}"></i><span>${g[1]}</span><b>${g[2]}<small>장 · ${pct(g[2])}</small></b></div>`).join('')}</div>`
    : `<div class="flm-bar"><span class="young" style="width:${pc(seen).toFixed(2)}%"></span></div>
      <p class="note">본 카드 ${seen}장 · 안 본 카드 ${unseen}장. 성숙도(배우는 중·어린·성숙)를 보려면 Supabase SQL Editor에서 sql/flash_progress.sql을 한 번 실행해 주세요.</p>`;
  return `<section style="display:flex;flex-direction:column;gap:10px">${head}${pills}
    ${ftView(s)}
    <span class="label">성숙도별 카드</span>${mat}
    <p class="note">${wk!==null?`최근 7일 ${wk}장(하루 평균 ${Math.round(wk/7)}장) · `:''}30일 ${x.reviews30}장 · 기억 유지율 ${keep===null?'–':keep+'%'} · 마지막 복습 ${last?fmtDate(last)+' ('+ago(last)+')':'없음'}</p>
    <p class="note dim">유지율은 복습 카드에서 '다시'를 누르지 않은 비율이에요.</p></section>`;
}

/* 안키 텍스트 가져오기와 같은 규칙: 줄마다 카드 하나, 첫 칸 앞면·둘째 칸 뒷면(셋째 칸부터는 뒷면에 줄을 바꿔 붙인다).
   구분 기호는 #separator: 머리줄이 있으면 그걸, 없으면 탭·|·; 가운데 줄마다 있는 것. "따옴표" 칸은 안에 줄바꿈·구분 기호를 품을 수 있고 ""는 따옴표 하나.
   #으로 시작하는 줄은 건너뛰고, <br>·</div>는 줄바꿈, 나머지 HTML 태그는 지운다(#html:false면 그대로 둔다). \\n도 줄바꿈. */
function ankiParse(text){
  text=String(text||'').replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  let sep=null, html=true;
  for(const l of text.split('\n')){ if(!l.startsWith('#')) { if(l.trim()) break; continue; }
    const m=l.match(/^#\s*([a-z ]+?)\s*:(.*)$/i); if(!m) continue; const k=m[1].toLowerCase().replace(/\s/g,''), v=m[2].trim();
    if(k==='separator') sep={tab:'\t',pipe:'|',semicolon:';',comma:',',space:' ',colon:':'}[v.toLowerCase()]||v[0]||null;
    if(k==='html') html=v.toLowerCase()!=='false'; }
  if(!sep){ const data=text.split('\n').filter(l=>l.trim()&&!l.startsWith('#')); sep=['\t','|',';'].find(c=>data.length&&data.filter(l=>l.includes(c)).length>=data.length/2)||'|'; }
  // 따옴표가 닫히지 않은 채 파일이 끝나면, 따옴표를 연 줄을 '모양이 맞지 않는 줄'로 알린다(뒤 카드가 한 칸에 몰래 빨려 들어가지 않게)
  const recs=[]; let rec=[], fld='', inQ=false, line=1, recLine=1, qLine=0, broken=0;
  for(let j=0;j<=text.length;j++){
    const ch=j<text.length?text[j]:'\n';
    if(inQ){ if(j===text.length){ inQ=false; broken=qLine; j--; continue; } if(ch==='"'){ if(text[j+1]==='"'){ fld+='"'; j++; } else inQ=false; } else { if(ch==='\n') line++; fld+=ch; } continue; }
    if(ch==='"'&&!fld.trim()){ inQ=true; qLine=line; fld=''; continue; }
    if(ch===sep){ rec.push(fld); fld=''; continue; }
    if(ch==='\n'){ rec.push(fld); if(rec.some(x=>x.trim())&&!(rec.length===1&&rec[0].trimStart().startsWith('#'))&&!rec[0].startsWith('#')) recs.push({line:broken||recLine,f:rec,broken:!!broken}); rec=[]; fld=''; line++; recLine=line; continue; }
    fld+=ch;
  }
  // 안키가 쓰는 HTML 태그만 지운다. '<보기>', 'x<y, z>w' 같은 글자는 그대로 둔다.
  const ent={nbsp:' ',amp:'&',lt:'<',gt:'>',quot:'"',apos:"'",'#39':"'"}, TAG='br|div|p|li|ul|ol|span|b|i|u|s|strong|em|font|sup|sub|a|img|hr|code|pre|table|tr|td|th|tbody|thead|h[1-6]|blockquote';
  const tagRe=new RegExp(`<\\/?(?:${TAG})(?:\\s[^<>]*)?\\/?>`,'gi');
  const clean=v=>{ v=String(v);
    if(html) v=v.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(div|p|li|tr|h[1-6])>/gi,'\n').replace(tagRe,'').replace(/&(nbsp|amp|lt|gt|quot|apos|#39);/gi,(m,k)=>ent[k.toLowerCase()]);
    return v.replace(/\\n(?![a-zA-Z])/g,'\n').split('\n').map(x=>x.trimEnd()).join('\n').trim(); };
  const rows=[], bad=[];
  recs.forEach(r=>{ if(r.broken){ bad.push(r.line); return; } const cols=r.f.map(clean), front=cols[0], back=cols.slice(1).filter(Boolean).join('\n');
    front&&back&&front.length<=2000&&back.length<=4000 ? rows.push({front, back, cols}) : bad.push(r.line); });
  return {rows, bad, sep};
}
/* 파일 여러 개 → 이미 있는 덱에 한꺼번에 넣기. 파일 이름과 덱 이름을 맞춰 자동 연결한다.
   비교: 맨 앞 알파벳 한 글자(B·C…)와 띄어쓰기·문장 부호는 빼고 글자만 본다.
   숫자는 양쪽 모두 있을 때만 같아야 한다('어휘 1강' ≠ '어휘 2강', 'C 음운 변동1 - 교체' = '음운 변동 - 교체').
   글자가 완전히 같으면 '확실'(✓), 한쪽 이름이 다른 쪽에 통째로 들어 있으면 '확인 필요'(?)로 표시한다.
   맞는 덱이 없으면 기본값은 '새 덱으로 만들기'. */
// 이미 쓰는 이름이면 ' (2)', ' (3)'…을 붙인다. 덱 이름 40자 제한 안에서 뒤 번호가 잘리지 않게 앞을 줄인다.
function flUniqueName(base, used){ base=String(base||'').trim().slice(0,40)||'새 덱'; let nm=base, k=2; while(used.has(nm)){ const suf=` (${k++})`; nm=base.slice(0,40-suf.length).trimEnd()+suf; } used.add(nm); return nm; }
const flBase = s => String(s||'').replace(/\.(txt|csv|tsv)$/i,'').trim().replace(/^[A-Za-z]\s+/,'');
const flKey = s => flBase(s).replace(/[0-9ⅠⅡⅢⅣⅤ]/g,'').replace(/[^\p{L}]/gu,'').toLowerCase();
const flNum = s => (flBase(s).match(/[0-9]+|[ⅠⅡⅢⅣⅤ]/g)||[]).map(x=>({'Ⅰ':'1','Ⅱ':'2','Ⅲ':'3','Ⅳ':'4','Ⅴ':'5'}[x]||String(+x))).join(',');
function flMatchDeck(name, decks){
  const k=flKey(name), n=flNum(name); if(!k) return {id:'__new', how:'new'};
  const numOk = d => { const m=flNum(d.name); return !n || !m || n===m; };
  const exact = decks.filter(d=>flKey(d.name)===k && numOk(d));
  if(exact.length){ const best=exact.find(d=>flNum(d.name)===n)||exact[0]; return {id:best.id, how:exact.length>1&&!exact.some(d=>flNum(d.name)===n)?'part':'exact'}; }
  const part = k.length>=2 ? decks.filter(d=>{ const dk=flKey(d.name); return dk.length>=2 && (k.includes(dk)||dk.includes(k)) && numOk(d); }) : [];
  if(part.length===1) return {id:part[0].id, how:'part'};
  return {id:'__new', how:'new'};
}

  const gsel=I.grades||[...new Set(A.decks.flatMap(d=>d.grades))];

      <select class="fi-sel" data-fi-ask="${i}" aria-label="${esc(x.file)}를 어떻게 할까요">${opt(x.choice,`<option value="" ${!x.choice?'selected':''}>넣지 않기</option><option value="__new" ${x.choice==='__new'?'selected':''}>새 덱을 만들어 넣기</option><optgroup label="이미 있는 덱에 넣기">`)}</optgroup></select>

    <div class="schedule-btns"><button class="linkbtn" type="button" data-fi-act="close">결과 닫기</button></div></section>`;
}
async function readTextFile(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  if(buf[0]===0xFF&&buf[1]===0xFE) return new TextDecoder('utf-16le').decode(buf);
  if(buf[0]===0xFE&&buf[1]===0xFF) return new TextDecoder('utf-16be').decode(buf);
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ return new TextDecoder('euc-kr').decode(buf); }
}
document.addEventListener('keydown', e=>{
  if(S.screen!=='flash' || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const f=S.fl; if(!f?.cur) return;
  if(!f.shown && (e.key===' '||e.key==='Enter')){ e.preventDefault(); f.shown=true; f.tShow=Date.now(); render(); return; }
  if(!f.shown) return;
  if(e.key===' '||e.key==='Enter'||e.key==='2'){ e.preventDefault(); flAnswer(3); }
  else if(e.key==='1') flAnswer(1);
  else if(e.key==='3' && f.mode!=='cram') flAnswer(4);
});

// 화살표 자동 변환: ->, <-, <->, <=> 뒤에 스페이스를 치면 화살표로 바꾼다. 긴 것부터 검사해야 <-> 가 <- 로 먼저 잡히지 않는다.
(()=>{
  const ARROWS = [['<=>','⇔'],['<->','↔'],['->','→'],['<-','←']];
  document.addEventListener('input', e=>{
    const t = e.target;
    if(e.inputType!=='insertText' || e.data!==' ' || e.isComposing) return;
    const ok = t instanceof HTMLTextAreaElement || (t instanceof HTMLInputElement && (t.type==='text' || t.type==='search'));
    if(!ok) return;
    const p = t.selectionStart;
    if(p==null || p!==t.selectionEnd || p<3) return;
    const before = t.value.slice(0, p-1);
    for(const [k,a] of ARROWS){
      if(!before.endsWith(k)) continue;
      const s = p-1-k.length;
      t.setRangeText(a, s, p-1);
      const c = s + a.length + 1;
      t.setSelectionRange(c, c);
      t.dispatchEvent(new Event('input', {bubbles:true}));
      return;
    }
  });
})();
